<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>刷题助手 · 数据库原理 + Hadoop 生态 + 数据结构</title>
<style>
/* ============================================================
   0. 主题变量 / 基础样式
   ============================================================ */
:root{
  --bg:#f4f6fb;
  --card:#ffffff;
  --ink:#1f2a37;
  --ink-2:#374151;
  --muted:#6b7280;
  --line:#e5e9f2;
  --primary:#4f46e5;
  --primary-2:#6366f1;
  --primary-soft:#eef1ff;
  --ok:#0e9f6e;
  --ok-soft:#e8f7f0;
  --bad:#dc2626;
  --bad-soft:#fdeceb;
  --warn:#b45309;
  --warn-soft:#fff6e5;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 26px -16px rgba(16,24,40,.28);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;
  line-height:1.65;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit}
code,kbd,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}

/* ============================================================
   1. 顶栏 / 标签页
   ============================================================ */
.topbar{
  position:sticky; top:0; z-index:50;
  background:rgba(255,255,255,.86);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:.2px;white-space:nowrap}
.brand .logo{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:14px;
  background:linear-gradient(135deg,var(--primary),#8b5cf6);
}
.chips{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.chip{
  font-size:12px;color:var(--ink-2);background:#f2f4f9;border:1px solid var(--line);
  padding:3px 10px;border-radius:999px;white-space:nowrap;
}
.chip b{color:var(--primary);font-weight:700}
.tabs{max-width:1000px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto}
.tab{
  border:none;background:transparent;color:var(--muted);font-size:14px;font-weight:600;
  padding:6px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;
}
.tab:hover{background:#eef1f7;color:var(--ink)}
.tab.active{background:var(--primary-soft);color:var(--primary)}

/* ============================================================
   2. 布局 / 卡片 / 按钮
   ============================================================ */
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 80px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;
}
.card + .card{margin-top:16px}
.card-title{font-size:16px;font-weight:700;margin:0 0 4px}
.card-sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);background:#fff;color:var(--ink-2);
  font-size:14px;font-weight:600;padding:9px 16px;border-radius:10px;cursor:pointer;
  transition:.15s ease; text-decoration:none;
}
.btn:hover{border-color:#cfd6e6;background:#fafbff}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:#4338ca;border-color:#4338ca}
.btn.ghost{background:#fff}
.btn.danger{color:var(--bad);border-color:#f3c2c2;background:#fff}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* ============================================================
   3. 首页
   ============================================================ */
.hero{
  background:linear-gradient(135deg,#eef2ff 0%,#f7f9ff 45%,#eefaf5 100%);
  border:1px solid #e3e8fb;border-radius:18px;padding:24px;margin-bottom:16px;
}
.hero h1{margin:0 0 6px;font-size:22px;letter-spacing:.3px}
.hero p{margin:0;color:var(--ink-2);font-size:14px;max-width:640px}
.hero .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tag{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink-2)}

.mode-card{
  border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff;cursor:pointer;
  transition:.18s ease; display:flex;flex-direction:column;gap:6px;text-align:left;
}
.mode-card:hover{border-color:#c7d0ea;box-shadow:0 10px 22px -16px rgba(79,70,229,.55);transform:translateY(-1px)}
.mode-card .m-ico{display:flex;color:var(--primary);margin-bottom:2px}
.mode-card .m-title{font-weight:700;font-size:15px}
.mode-card .m-desc{font-size:13px;color:var(--muted);line-height:1.5}
.mode-card .m-meta{font-size:12px;color:var(--primary);font-weight:600;margin-top:2px}

.chapter-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.ch-item{
  display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;background:#fff;cursor:pointer;transition:.15s ease;text-align:left;
}
.ch-item:hover{border-color:var(--primary);background:var(--primary-soft)}
.ch-idx{
  width:32px;height:32px;flex:0 0 32px;border-radius:9px;background:#f2f4f9;color:var(--primary);
  display:grid;place-items:center;font-size:13px;font-weight:700;
}
.ch-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ch-name{font-weight:650;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-desc{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-right{font-size:12px;color:var(--muted);text-align:right;flex:0 0 auto}

/* ============================================================
   4. 章节 / 统计条
   ============================================================ */
.bar{height:6px;background:#eef0f6;border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#8b5cf6);border-radius:999px}

.stat-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fcfdff}
.kpi .k-l{font-size:12px;color:var(--muted)}
.kpi .k-v{font-size:22px;font-weight:750;letter-spacing:.3px}
.kpi .k-v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}

table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
table.tb th,table.tb td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.tb th{color:var(--muted);font-weight:600;font-size:12.5px;background:#fafbfe}
table.tb tr:last-child td{border-bottom:none}
.tb-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}

/* ============================================================
   5. 答题界面
   ============================================================ */
.quiz-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.quiz-title{font-weight:700;font-size:15px}
.quiz-sub{font-size:12.5px;color:var(--muted)}
.timer{
  margin-left:auto;font-weight:700;font-size:14px;color:var(--primary);background:var(--primary-soft);
  border-radius:9px;padding:4px 12px;font-variant-numeric:tabular-nums;
}
.progress{height:5px;background:#e9edf6;border-radius:999px;overflow:hidden;margin-bottom:14px}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#8b5cf6);transition:width .25s ease}

.dots{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.dot{
  width:27px;height:27px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--muted);
  font-size:11.5px;font-weight:600;cursor:pointer;padding:0;
}
.dot.ok{background:var(--ok-soft);border-color:#b9e6d3;color:var(--ok)}
.dot.bad{background:var(--bad-soft);border-color:#f5c6c2;color:var(--bad)}
.dot.cur{outline:2px solid var(--primary);outline-offset:1px;color:var(--primary);font-weight:700}

.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.q-src{font-size:11.5px;color:#9aa3b2;margin:-4px 0 10px;letter-spacing:.1px}
.badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--primary-soft);color:var(--primary)}
.badge.gray{background:#f2f4f9;color:var(--muted);font-weight:600}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.pts{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}

.stem{font-size:15.5px;line-height:1.75;margin:0 0 14px;word-break:break-word}
.stem b{color:var(--primary)}
.stem code{background:#f4f6fb;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:13.5px;color:#334155}
.tbl-note{
  margin:0 0 14px;padding:10px 12px;background:#f8faff;border:1px dashed #cfd8f2;border-radius:10px;
  font-size:13px;color:var(--ink-2);line-height:1.85;
}
.tbl-note u{text-decoration:underline;text-underline-offset:2px;color:var(--primary);font-weight:700}
pre.sch{
  background:#f8faff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;
  overflow-x:auto;margin:0 0 14px;line-height:1.7;color:#334155;
}
.blank{color:var(--primary);font-weight:700;letter-spacing:1px}

/* 选项 */
.options{display:grid;gap:9px}
.opt{
  display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;cursor:pointer;background:#fff;transition:.13s ease;font-size:14.5px;
}
.opt:hover{border-color:#c3cdf0;background:#fafbff}
.opt .opt-key{
  flex:0 0 22px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:700;background:#f2f4f9;color:var(--muted);margin-top:1px;
}
.opt.selected{border-color:var(--primary);background:var(--primary-soft)}
.opt.selected .opt-key{background:var(--primary);color:#fff}
.opt.correct{border-color:#9adfc2;background:var(--ok-soft)}
.opt.correct .opt-key{background:var(--ok);color:#fff}
.opt.wrong{border-color:#f3b6b2;background:var(--bad-soft)}
.opt.wrong .opt-key{background:var(--bad);color:#fff}
.opt.locked{cursor:default}

/* 填空 */
.fill-row{display:flex;gap:10px;flex-wrap:wrap}
.inp{
  flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;
  color:var(--ink);background:#fff;outline:none;transition:.15s;
}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.inp:disabled{background:#f8fafc;color:var(--ink-2)}
.inp.ok{border-color:#9adfc2;background:var(--ok-soft)}
.inp.bad{border-color:#f3b6b2;background:var(--bad-soft)}

/* 术语填空：缩写 / 全称 / 中文 三行 */
.term-table{display:grid;gap:8px;margin:6px 0 2px}
.term-row{display:flex;align-items:flex-start;gap:10px}
.term-row .tr-l{
  flex:0 0 78px;text-align:right;font-size:12.5px;color:var(--muted);
  line-height:1.4;padding-top:12px;letter-spacing:.2px;
}
.term-row .tr-in{flex:1;min-width:0}
.term-row .inp{width:100%;min-width:0;font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:14.5px}
.term-row .tr-v{
  flex:1;min-width:0;border:1px dashed #d5cdf7;background:var(--primary-soft);border-radius:10px;
  padding:9px 12px;font-size:14.5px;font-weight:700;color:var(--primary-2);
  font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;
}
.term-row .tr-tag{
  flex:0 0 auto;font-size:11px;line-height:1;color:var(--primary);background:var(--primary-soft);
  border-radius:6px;padding:4px 7px;margin-top:11px;
}
.tr-ans{display:block;margin:4px 0 0 2px;font-size:12.5px;color:var(--bad)}
.term-full{
  margin-top:4px;padding:7px 10px;background:#fff;border:1px dashed var(--line);border-radius:8px;
  font-size:13px;color:var(--ink-2);word-break:break-word;
}

/* 反馈 */
.feedback{margin-top:14px;border-radius:11px;padding:12px 14px;font-size:14px;line-height:1.75}
.fb-ok{background:var(--ok-soft);border:1px solid #b9e6d3}
.fb-bad{background:var(--bad-soft);border:1px solid #f5c6c2}
.fb-warn{background:var(--warn-soft);border:1px solid #f3dcae}
.fb-title{font-weight:750;margin-bottom:2px}
.fb-ok .fb-title{color:var(--ok)}
.fb-bad .fb-title{color:var(--bad)}
.fb-warn .fb-title{color:var(--warn)}
.fb-exp{color:var(--ink-2);font-size:13.5px;margin-top:6px;border-top:1px dashed rgba(0,0,0,.09);padding-top:6px}
.fb-exp b{color:var(--ink)}

/* 大题 */
.part{border-top:1px dashed var(--line);padding:12px 0 2px}
.part:first-child{border-top:none;padding-top:0}
.part-q{font-size:14px;font-weight:600;margin-bottom:8px}
.part-q b{color:var(--primary)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip-opt{
  border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:13.5px;cursor:pointer;background:#fff;
}
.chip-opt:hover{border-color:#c3cdf0;background:#fafbff}
.chip-opt.selected{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:650}
.chip-opt.correct{border-color:#9adfc2;background:var(--ok-soft);color:var(--ok);font-weight:650}
.chip-opt.wrong{border-color:#f3b6b2;background:var(--bad-soft);color:var(--bad);font-weight:650}
.chip-opt.locked{cursor:default}
.essay-input{
  width:100%;min-height:120px;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:14px;
  line-height:1.7;font-family:inherit;color:var(--ink);background:#fff;resize:vertical;outline:none;
}
.essay-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.essay-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

.rubric-list{display:grid;gap:6px;margin-top:10px}
.r-item{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.55}
.r-mark{flex:0 0 18px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.r-ok .r-mark{background:var(--ok)}
.r-bad .r-mark{background:#cbd5e1}
.r-w{color:var(--muted);font-size:12px;margin-left:auto;flex:0 0 auto}

.selfcheck-box{margin-top:14px;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fcfdff}
.sc-head{font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:8px}
.sc-item{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;padding:4px 0;cursor:pointer;line-height:1.55}
.sc-item input{margin-top:4px;accent-color:var(--primary);width:15px;height:15px;flex:0 0 auto}
.sc-item span{flex:1 1 auto;min-width:0}
.sc-item em{margin-left:8px;font-style:normal;font-size:12px;color:var(--muted);flex:0 0 auto;padding-top:1px}
.sc-sum{margin-top:8px;font-size:13px;color:var(--primary);font-weight:650}

.answer-box{
  margin-top:12px;border:1px solid #dbe3f7;background:#f9fbff;border-radius:11px;padding:12px 14px;
  font-size:13.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word;
}
.answer-box .ab-title{font-weight:750;color:var(--primary);margin-bottom:6px;font-size:13px}

/* 底部导航 */
.quiz-nav{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.quiz-nav .spacer{flex:1}
.hint{font-size:12.5px;color:var(--muted)}

/* 结果页 */
.score-big{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{
  width:104px;height:104px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  background:conic-gradient(var(--primary) calc(var(--p) * 1%), #e9edf6 0);
}
.ring > div{
  width:82px;height:82px;border-radius:50%;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-size:24px;font-weight:750;color:var(--primary);line-height:1.15;
}
.ring small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.res-list{display:grid;gap:8px;margin-top:6px}
.res-item{
  display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px;
  background:#fff;
}
.res-item .ri-idx{color:var(--muted);font-size:12px;width:26px;flex:0 0 26px}
.res-item .ri-stem{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-item .ri-score{font-weight:700;font-size:13px;flex:0 0 auto}

/* 错题本 */
.wrong-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.wrong-item + .wrong-item{margin-top:10px}
.wi-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.wi-stem{font-size:14px;line-height:1.6;color:var(--ink-2)}
.wi-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
.empty .e-ico{font-size:34px;margin-bottom:8px}

/* 说明页 */
.doc h3{font-size:15px;margin:18px 0 6px}
.doc p,.doc li{font-size:14px;color:var(--ink-2)}
.doc ul{padding-left:20px;margin:6px 0}
.doc code{background:#f4f6fb;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:13px}

/* ============================================================
   6. 知识点总结 / 章节准备页
   ============================================================ */
.know-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.know-head .btn{margin-left:auto}
.know-top{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.k-chip{
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;
  font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:.15s;
}
.k-chip:hover{border-color:var(--primary);color:var(--primary)}
.k-chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.k-lead{
  margin:14px 0 0;padding:12px 14px;border-radius:11px;font-size:14px;line-height:1.85;color:var(--ink-2);
  background:linear-gradient(135deg,#eef2ff,#f8faff);border:1px solid #e3e8fb;
}
.k-sec{margin:0 0 20px}
.k-sec:last-child{margin-bottom:0}
.k-sec h3{
  font-size:15px;margin:0 0 9px;display:flex;align-items:center;gap:8px;letter-spacing:.2px;
}
.k-sec h3::before{content:'';width:4px;height:15px;border-radius:2px;background:linear-gradient(180deg,var(--primary),#8b5cf6);flex:0 0 4px}
.k-sec p{margin:0 0 9px;font-size:14px;line-height:1.9;color:var(--ink-2)}
.k-sec ul{margin:7px 0 10px;padding-left:20px}
.k-sec li{font-size:14px;line-height:1.9;color:var(--ink-2);margin-bottom:2px}
.k-sec b{color:var(--primary)}
.k-sec code{background:#f4f6fb;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:13px;color:#334155}
.k-sec table.tb td{line-height:1.7}
.k-sec table.tb td b{color:var(--primary)}
.kv{display:grid;gap:6px;margin:9px 0 10px}
.kv-row{
  display:flex;gap:10px;background:#fbfcff;border:1px solid var(--line);border-radius:9px;
  padding:8px 11px;font-size:13.5px;line-height:1.75;
}
.kv-k{flex:0 0 138px;font-weight:700;color:var(--primary)}
.kv-v{flex:1;min-width:0;color:var(--ink-2)}
.k-tip{
  margin:10px 0 4px;padding:9px 12px;border-left:3px solid #eab308;background:var(--warn-soft);

<script>
/* ================================================================
   数据库原理 · 刷题与自动判分（单文件版）
   ----------------------------------------------------------------
   结构：
     1) 章节定义 CHAPTERS
     2) 题库 CHOICE / FILL / ESSAY（纯 JS 对象数组，方便增删题）
     3) 判分引擎（填空容错匹配 / SQL 语义要点匹配 / 大题分项判分）
     4) 状态存储（localStorage：错题、得分、已练章节）
     5) 视图渲染（首页 / 答题 / 结果 / 错题本 / 统计 / 说明）
     6) 事件委托（统一的点击、输入处理）
   ================================================================ */

/* ================================================================
   1. 章节定义（chapter 字段与题目关联）
   ================================================================ */
const CHAPTERS = [
  { id:'ch1', name:'基础概念',        desc:'DBMS/DBS/DDL/DML/DCL/TCL、C/S 与 B/S（缩写·全称·中文）' },
  { id:'ch2', name:'关系与运算',      desc:'σ 与 π、∪ ∩ − ⋈ ×、元组/属性/键/外码' },
  { id:'ch3', name:'建模与 E-R',      desc:'E-R 图三要素、概念设计→关系模式' },
  { id:'ch4', name:'SQL 编写',        desc:'S/C/SC 三表：连接、嵌套、分组聚合' },
  { id:'ch5', name:'依赖与范式',      desc:'函数依赖、1NF~BCNF、分解与闭包' },
  { id:'ch6', name:'事务与控制',      desc:'事务三要素、ACID、锁、可串行化、游标' },
  { id:'ch7', name:'安全与恢复',      desc:'完整性、授权回收、故障与恢复' }
];
const CH_MAP = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
/* 章节名按「当前科目」解析：数据库原理 ch1~ch7，Hadoop h1~h11 */
function chName(id){
  const list = (SUBJECTS[CUR_SUB] || SUBJECTS.db).chapters;

  ch5: {
    name: '依赖与范式',
    lead: '这一章是理论重灾区，但套路极强：判范式只看“非主属性有没有部分/传递依赖”，求候选码只用闭包算法，判无损只看“公共属性能不能决定其中一个子模式”。掌握四步流程，这类题就变成机械劳动。',
    sections: [
      {
        h: '5.1 函数依赖（FD）的定义与分类',
        p: '设 R(U)，X、Y ⊆ U。若对 R 的任意两个元组，只要 X 值相同就必有 Y 值相同，则称 <b>X 函数决定 Y</b>，记作 X→Y。',
        table: {
          head: ['类型', '定义', '例子'],
          rows: [
            ['平凡 FD', 'Y ⊆ X，如 AB→A', '对任何关系都成立，讨论范式时忽略'],
            ['非平凡 FD', 'Y ⊄ X', '真正有约束力的依赖'],
            ['完全 FD', 'X→Y 且 X 的任何真子集都推不出 Y', '(SNO,CNO)→GRADE'],
            ['部分 FD', '存在 X 的真子集 X′ 使 X′→Y', '(SNO,CNO)→SNAME（因为 SNO→SNAME）'],
            ['传递 FD', 'X→Y，Y→Z 且 Y↛X、Z ⊄ Y', 'SNO→SDEPT，SDEPT→DNAME，则 SNO→DNAME 传递']
          ]
        }
      },
      {
        h: '5.2 求候选码：闭包算法（三步）',
        ul: [
          '① 把只出现在 FD <b>左部</b>的属性（和两边都没出现的属性）先放进候选码——它们必须属于任何候选码。',
          '② 求这个属性集的<b>闭包</b>：反复用 F 中的 FD 向右扩展，直到不能再扩。若闭包 = U（全部属性），它就是候选码。',
          '③ 若还推不出全部属性，就<b>逐个加入</b>剩余属性再求闭包，并检查<b>最小性</b>（去掉任一属性后闭包不再等于 U）。'
        ],
        p: '例：R(A,B,C,D)，F = { AB→C, C→D, D→A }。<br>AB⁺ = {A,B,C,D}，且 A⁺={A}、B⁺={B} 都不行，所以 <b>AB 是候选码</b>；<br>同理 BC⁺ = {B,C,D,A}、BD⁺ = {B,D,A,C} 也都等于 U 且最小，所以候选码共 <b>3 个：AB、BC、BD</b>；<br>于是 A、B、C、D <b>全是主属性</b>，没有非主属性——该模式必然满足 2NF、3NF；但因为 <b>C→D 中 C 不是超码</b>，所以<b>不是 BCNF</b>。'
      },
      {
        h: '5.3 范式阶梯（判断只看“消除了什么”）',
        table: {
          head: ['范式', '条件', '消除了什么', '一句话判据'],
          rows: [
            ['1NF', '每个分量都是不可再分的原子值', '表中套表', '没有多值列 / 复合列'],

            ['3NF', '2NF + 每个非主属性不传递依赖于候选码', '非主属性对码的<b>传递</b>依赖', '非主属性之间不能互相决定'],
            ['BCNF', '每个决定因素都包含候选码', '主属性对码的部分与传递依赖', '所有左部都是超码'],

        tip: '快速判断链：先找候选码 → 标出主属性 / 非主属性 → 看有没有非主属性部分依赖（2NF 破了）→ 看有没有非主属性传递依赖（3NF 破了）→ 看有没有“左部不是超码”的 FD（BCNF 破了）。'
      },
      {
        h: '5.4 最小依赖集（最小覆盖）三步法',
        ul: [
          '① <b>右部单属性化</b>：X→YZ 拆成 X→Y 与 X→Z。',
          '② <b>去掉左部多余属性</b>：对每个 X→A，逐个尝试去掉 X 中的属性 B，若 (X−B)⁺ 仍能推出 A，则 B 多余，删掉。',
          '③ <b>去掉多余 FD</b>：对每个 FD，暂时删掉它，若剩下的 FD 集合仍能推出它，则它多余，永久删除。'
        ],
        p: '最小依赖集<b>不唯一</b>（第 ②③ 步的处理顺序会影响结果），但所有最小依赖集的 FD 个数相同。'
      },
      {
        h: '5.5 模式分解：无损连接与保持依赖',
        ul: [
          '<b>无损连接</b>：分解后自然连接能还原原关系，不丢信息也不多出假元组。',
          '<b>两个子模式</b>的判定定理：R 分解为 R1、R2 是无损的充要条件是 <b>(R1∩R2) → (R1−R2)</b> 或 <b>(R1∩R2) → (R2−R1)</b> 成立。即<b>公共属性能决定其中一个子模式</b>即可。',
          '公共属性为空 ⇒ 一定是笛卡尔积 ⇒ <b>有损</b>。',
          '<b>保持依赖</b>：每个 FD 都能在某个子模式内部被验证，不需要连接后再检查。',
          '重要结论：3NF 的分解可以同时做到<b>无损且保持依赖</b>；BCNF 的分解只能保证<b>无损</b>，可能丢失依赖。'
        ],
        p: '例：R(A,B,C)，F = {A→B, B→C}，分解为 R1(A,B)、R2(B,C)。公共属性 B，B⁺ = {B,C} 包含 R2 的全部属性，故<b>无损</b>；且 A→B 在 R1 中、B→C 在 R2 中，故<b>保持依赖</b>。'

      {
        h: '5.6 规范化的目的与代价',
        p: '规范化通过<b>投影分解</b>消除数据冗余与插入、删除、更新异常。代价是查询时需要更多连接，性能下降。所以工程上常做“<b>适度反规范化</b>”：先按 3NF 设计，再对高频查询有控制地冗余。'

      'BCNF 一定满足 3NF；4NF 一定满足 BCNF；反之都不成立。',
      '无损分解与保持依赖是<b>两件独立的事</b>，一个分解可能无损但不保持依赖。',

  },

/* ================================================================
   3. 判分引擎
   ================================================================ */

/** HTML 转义（用于展示用户输入/普通文本） */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/**
 * 富文本清洗（白名单）：先整体转义，再只把少数无属性的行内标签还原。
 * 题库的 explanation 里偶尔用 <b> 强调、<code> 标注代码，若不还原会被当成
 * 纯文本把尖括号显示出来。白名单之外的任何标签（含带属性的）一律保持转义，
 * 因此即便题库内容被污染也不会引入 XSS。
 */
function rich(s){
  return esc(s)
    .replace(/&lt;(\/?)(b|strong|i|em|u|code|sub|sup)&gt;/gi, '<$1$2>')
    .replace(/&lt;br\s*\/?&gt;/gi, '<br>');
}

/** 全角 → 半角 */
function toHalf(s){
  return String(s || '').replace(/[\uFF01-\uFF5E]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
}

/**
 * 填空/短答案归一化：
 *   小写、去空格、去常见中英文标点、全角转半角
 * 目的：让「DISTINCT」「distinct 」「 distinct。 」都能匹配。
 */
function normText(s){
  return toHalf(s)
    .trim()
    .toLowerCase()
    .replace(/\s+/g,'')
    .replace(/[。．.，,；;、:：!！?？"'“”‘’()（）\[\]【】{}<>《》]/g,'');
}

/**
 * 容错匹配：
 *   1) 归一化后完全相同 → 命中
 *   2) 用户答案包含标准答案（如「原子性Atomicity」包含「原子性」）→ 命中
 */
function matchText(val, accept){
  const v = normText(val);
  if (!v) return false;
  return (accept || []).some(a => {
    const n = normText(a);
    if (!n) return false;
    return v === n || v.includes(n);
  });
}

/* ---------------- 术语填空（缩写 / 全称 / 中文）判分 ---------------- */

/**
 * 术语归一化：比 normText 更"狠"一点，额外去掉连字符、斜杠、下划线、点。
 * 于是下列写法被视为同一个答案：
 *   "Boyce-Codd Normal Form" ≡ "boyce codd normal form"
 *   "Entity-Relationship"   ≡ "Entity Relationship"
 *   "C/S"                   ≡ "CS"
 * 注意：这里不做"包含即命中"，避免把 DB 判成 DBMS。
 */
function normTerm(s){
  return toHalf(s)
    .toLowerCase()
    .replace(/[\s\-_·./\\]/g, '')
    .replace(/[。．，,；;、:：!！?？"'“”‘’()（）\[\]【】{}<>《》]/g, '');
}

/** 单个空的判分：与「标准答案 + 等价写法」逐个精确比对 */
function termBlankOk(val, q, key){
  const raw = String(val == null ? '' : val);
  /* 容错：允许在英文后面补括号注释，如 "Database Management System（数据库管理系统）" */
  const cands = [raw, raw.replace(/[（(][^）)]*[）)]/g, '')].map(normTerm).filter(Boolean);
  if (!cands.length) return false;
  const list = [q[key]].concat((q.alt && q.alt[key]) || []).map(normTerm).filter(Boolean);
  return cands.some(v => list.some(a => v === a));
}

/**
 * 术语整题判分（按空平均给分）
 * @param {Object} q    题目对象
 * @param {Object} vals { abbr:'…', full:'…', cn:'…' } 学生填写的值
 * @returns {{pct:number, ok:number, full:number, rows:Array}}
 *   rows 供渲染逐行对错（含"已给出"的行，该行恒算对）
 */
function gradeTerm(q, vals){
  vals = vals || {};
  const asked = TERM_ROWS.filter(k => k.key !== q.given);
  let ok = 0;
  const rows = TERM_ROWS.map(k => {
    const given = (k.key === q.given);
    const val   = given ? q[k.key] : (vals[k.key] || '');
    const hit   = given ? true : termBlankOk(val, q, k.key);
    if (!given && hit) ok++;
    return { key:k.key, label:k.label, answer:q[k.key], val, given, ok:hit };
  });
  return { pct: asked.length ? Math.round(ok / asked.length * 100) : 0, ok, full: asked.length, rows };
}

/**
 * SQL 归一化：忽略大小写、多余空格、标识符引号、中英文标点差异
 */
function normSQL(raw){
  let t = toHalf(raw);
  t = t.toLowerCase();
  t = t.replace(/[`"“”]/g,' ')      // 去掉反引号与双引号
       .replace(/；/g,';')
       .replace(/，/g,',')
       .replace(/（/g,'(').replace(/）/g,')')
       .replace(/\s+/g,' ')
       .trim()
       .replace(/;\s*$/,'');
  return t;
}

/**
 * 去掉表别名声明，例如：
 *   "from sc a where"      → "from sc where"
 *   "from sc as x where"   → "from sc where"
 * 这样「带别名 / 不带别名」两种写法在要点匹配时被同等看待。
 */
/* 这些词不会被当成「表名 别名」而删掉。
   注意必须包含 PRIMARY KEY / FOREIGN KEY 的组成词，否则 "primary key" 会被
   stripAlias 误判成「表名 primary + 别名 key」，把 KEY 删掉（已修正）。 */
const SQL_KEYWORDS = /^(select|from|where|and|or|not|in|exists|on|join|left|right|inner|outer|full|cross|natural|using|group|order|by|having|as|union|all|distinct|count|sum|avg|max|min|like|between|is|null|desc|asc|case|when|then|else|end|limit|offset|values|set|insert|into|update|delete|create|table|primary|key|foreign|references|check|unique|default|constraint|index|view|trigger|add|drop|alter|column|grant|revoke|to|with|option|public|execute|procedure|function|declare|begin|if|while|for|each|row|of|int|integer|string|double|float|bigint|smallint|tinyint|decimal|boolean|date|timestamp|varchar|char|binary|array|map|struct)$/;
function stripAlias(t){
  return t.replace(/([a-z_][a-z0-9_]*)\s+(?:as\s+)?([a-z]{1,3})(?![a-z0-9_])/g, (m, tbl, al) => {
    if (SQL_KEYWORDS.test(tbl)) return m;  // 前一个词是关键字，不动
    if (SQL_KEYWORDS.test(al))  return m;  // 后一个词是关键字，不动
    return tbl;                            // 否则视为「表名 别名」，去掉别名
  });
}

/**
 * 要点匹配：一条 rubric 命中即得分
 *   item.re        正则字面量（可带 g 标志 + minCount 表示至少出现几次）
 *   item.minCount  最少出现次数（默认 1）
 * 注意：每次都用新的 RegExp 实例，避免 g 标志导致 lastIndex 状态污染。
 */
function hitRubric(item, text){
  const flags = item.re.flags.includes('g') ? 'g' : '';
  const re = new RegExp(item.re.source, flags);
  const m = text.match(re);
  const n = m ? m.length : 0;
  return n >= (item.minCount || 1);
}

/**
 * 大题判分主函数
 * @param {Object} q     题目对象
 * @param {string} raw   学生作答文本（大题文本框内容）
 * @param {Object} pv    parts 作答值 { 0:0, 1:'A' }（判断类小问）
 * @returns {{got:number, full:number, pct:number, detail:Array}}
 *   got/full 只统计「机器可判」部分；自评部分由 UI 另加。
 */
function gradeEssay(q, raw, pv){
  const text = stripAlias(normSQL(raw));
  let got = 0, full = 0;
  const detail = [];

  /* (1) 判断类小问：单选 / 短答 —— 客观判分 */
  (q.parts || []).forEach((p, i) => {
    const val = pv ? pv[i] : undefined;
    let ok = false;
    if (p.kind === 'choice') ok = Number(val) === p.answer;
    else if (p.kind === 'text') ok = matchText(val, p.accept || []);
    if (ok) got += p.score;
    full += p.score;
    detail.push({
      type:'part',
      label: p.label,
      w: p.score,
      ok,
      hint: p.kind === 'choice' ? p.options[p.answer] : (p.accept || [])[0]
    });
  });

  /* (2) 语义要点：关键字 + 逻辑结构匹配 —— 覆盖 80% 以上常见写法 */
  (q.rubric || []).forEach(r => {
    const ok = hitRubric(r, text);
    if (ok) got += r.w;
    full += r.w;
    detail.push({ type:'rubric', label: r.label, w: r.w, ok });
  });

  /* 完全空答直接 0 分，避免空字符串误命中某些宽松正则 */
  if (!text.replace(/[\s;]/g,'').length && got > 0 && (!q.parts || !q.parts.length)) got = 0;
  if (!text.replace(/[\s;]/g,'').length && q.rubric && q.rubric.length) {
    // 文本为空时，仅保留判断小问的得分
    got = detail.filter(d => d.type === 'part' && d.ok).reduce((a, b) => a + b.w, 0);
  }

  const pct = full ? Math.round(got / full * 100) : 0;
  return { got, full, pct, detail };
}

/* ================================================================
   4. 状态存储（localStorage，按科目隔离）
   ----------------------------------------------------------------
   S = {
     records: { qid: { seen, right, wrong, lastPct, ts } },  // 每题作答统计
     wrong:   { qid: 时间戳 },                                // 错题本
     sessions:[ { ts, mode, title, pct, total, answered } ],  // 练习/考试记录
   }
   键名规则：
     · 数据库原理 → db_quiz_state_v1（沿用原键名，旧进度无缝保留）
     · Hadoop 生态 → hadoop_quiz_state_v1
   iOS 兼容要点：
     · Safari 无痕 / 某些 file:// 环境会直接抛异常，所有读写都必须 try-catch；
     · 读写失败不阻塞刷题，只在顶部固定提示「无法保存进度」。
   ================================================================ */
const EMPTY_STATE = { records:{}, wrong:{}, sessions:[] };
let S = null;
let STORE_OK = true;      // 本地存储是否可用（false 时页面仍可正常刷题）

function emptyState(){
  return { records:{}, wrong:{}, sessions:[] };
}
function storeKey(){
  return subj().storeKey;
}

/** 启动时探测一次 localStorage 是否可写（无痕模式下可能可读不可写） */
function probeStorage(){
  try {
    const k = '__quiz_probe__';
    localStorage.setItem(k, '1');
    localStorage.removeItem(k);
    return true;
  } catch (e) {
    return false;
  }
}

/** 顶部固定提示：只在不可保存时出现一次 */
function showStoreWarn(){
  if (!STORE_OK) return;
  STORE_OK = false;
  document.body.classList.add('store-fail');
  const el = document.getElementById('storeWarn');
  if (el) el.removeAttribute('hidden');
}

/** 读取当前科目状态；解析失败或隐私模式下降级为空状态（不影响判分） */
function loadState(){
  try {
    const raw = localStorage.getItem(storeKey());
    S = raw ? JSON.parse(raw) : emptyState();
  } catch (e) {
    S = emptyState();
    showStoreWarn();
  }
  S.records  = S.records  || {};
  S.wrong    = S.wrong    || {};
  S.sessions = S.sessions || [];
}

/** 写入当前科目状态；失败时提示但不抛出，保证继续刷题 */
function saveState(){
  try {
    localStorage.setItem(storeKey(), JSON.stringify(S));
  } catch (e) {
    showStoreWarn();
  }
}

/**
 * 读取任意科目的进度（首页科目卡片用，不切换当前科目）
 * 解析失败返回空统计，不影响页面
 */
function statsOfSubject(sid){
  const s = SUBJECTS[sid];
  let st = emptyState();
  try {
    const raw = localStorage.getItem(s.storeKey);
    if (raw) st = JSON.parse(raw) || emptyState();
  } catch (e) { st = emptyState(); }
  const recs = st.records || {};
  let seen = 0, right = 0, touched = 0;
  Object.keys(recs).forEach(k => {
    const r = recs[k] || {};
    seen += r.seen || 0;
    right += r.right || 0;
    touched++;
  });
  const total = s.bank.length;
  return {
    total, touched, seen, right,
    acc: seen ? Math.round(right / seen * 100) : 0,
    wrong: Object.keys(st.wrong || {}).length,
    cover: total ? Math.round(touched / total * 100) : 0
  };
}

/**
 * 切换科目：
 *   1) 先把当前科目状态落盘
 *   2) 换 CUR_SUB（题库 / 章节 / 知识点 / 键名全部随之切换）
 *   3) 重新读状态，清空当前会话与计时器，回到该科目首页

/**
 * 记录一次判分结果
 * @param {string} qid
 * @param {number} pct  得分率 0~100
 * @param {boolean} updateOnly  true 表示「自评修正」，不重复累加 seen
 */
function markResult(qid, pct, updateOnly){
  const rec = S.records[qid] || (S.records[qid] = { seen:0, right:0, wrong:0, lastPct:null, ts:0 });
  const isOk = pct >= 60;
  if (!updateOnly) {
    rec.seen++;
    if (isOk) rec.right++; else rec.wrong++;
  } else {
    const wasOk = rec.lastPct != null && rec.lastPct >= 60;
    if (wasOk !== isOk) {
      if (isOk) { rec.right++; rec.wrong = Math.max(0, rec.wrong - 1); }
      else      { rec.wrong++; rec.right = Math.max(0, rec.right - 1); }
    }
  }
  rec.lastPct = pct;
  rec.ts = Date.now();
  if (isOk) delete S.wrong[qid];
  else S.wrong[qid] = Date.now();
  saveState();
}

/* ---------- 统计辅助（全部按当前科目计算） ---------- */
function overallStats(){
  const bank = allBank();
  let seen = 0, right = 0, touched = 0;
  Object.keys(S.records).forEach(k => {
    const r = S.records[k];
    seen += r.seen; right += r.right; touched++;
  });
  return {
    totalQuestions: bank.length,
    touched,
    seen,
    right,
    acc: seen ? Math.round(right / seen * 100) : 0,
    wrongCount: Object.keys(S.wrong).length
  };
}
function chapterStats(chId){
  const qs = allBank().filter(q => q.chapter === chId);
  let touched = 0, seen = 0, right = 0;
  qs.forEach(q => {
    const r = S.records[q.id];
    if (r) { touched++; seen += r.seen; right += r.right; }
  });
  return { total: qs.length, touched, seen, right, acc: seen ? Math.round(right / seen * 100) : 0 };
}
function chapterQuestions(chId){ return allBank().filter(q => q.chapter === chId); }

/**
 * 知识点列表：把当前科目题库按 knowledgePoint 聚合
 * 数据库原理的题目没有 knowledgePoint 字段，则退回按「章节名」聚合，
 * 这样「按知识点练习」页面对每个科目都可用。
 */
function kpKeyOf(q){ return q.knowledgePoint || chName(q.chapter); }
function kpList(){
  const map = new Map();
  allBank().forEach(q => {
    const kp = kpKeyOf(q);
    if (!map.has(kp)) map.set(kp, { kp, chapter:q.chapter, qs:[] });
    map.get(kp).qs.push(q);
  });
  return Array.from(map.values());
}
function kpStats(kp){
  const qs = allBank().filter(q => kpKeyOf(q) === kp);
  let touched = 0, seen = 0, right = 0;
  qs.forEach(q => {
    const r = S.records[q.id];
    if (r) { touched++; seen += r.seen; right += r.right; }
  });
  return {
    total: qs.length, touched, seen, right,
    acc: seen ? Math.round(right / seen * 100) : 0,
    cover: qs.length ? Math.round(touched / qs.length * 100) : 0
  };
}
/** 题目纯文本（搜索/错题本摘要用） */
function plainStem(q){
  return String(q.stem || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
}

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickRandom(arr, n){ return shuffle(arr).slice(0, Math.min(n, arr.length)); }
function fmtTime(sec){
  const m = Math.floor(sec / 60), s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function startSession(mode, title, qs, opts){

   Hadoop 生态：随机卷 = 6 选择类 + 4 命令/代码/填空 + 2 匹配/排序 + 3 简答/HiveQL/纠错
                模拟考 = 10 + 6 + 2 + 3（60 分钟）

    const pick = (types, n) => pickRandom(allBank().filter(q => types.includes(q.type)), n);

      ...pick(['code'], 2),

      ...pick(['choice', 'multi'], 6),
      ...pick(['cmd', 'code', 'fill'], 4),
      ...pick(['match', 'order'], 2),
      ...pick(['sql', 'fix', 'text'], 3)
    ];

/* ---------------- 6.1.2 搜索 ---------------- */
let searchQ = '';

function searchResultHtml(kw){
  const words = String(kw || '').toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) {
    return `<div class="empty">输入关键词开始搜索，例如「NameNode」「副本放置」「Shuffle」</div>`;
  }
  const hits = allBank().filter(q => {
    const hay = (plainStem(q) + ' ' + (q.knowledgePoint || '') + ' ' +
      (q.tags || []).join(' ') + ' ' + chName(q.chapter) + ' ' + (q.source || '')).toLowerCase();
    return words.every(w => hay.includes(w));
  });
  if (!hits.length) return `<div class="empty">没有匹配的题目，换个关键词试试</div>`;
  const shown = hits.slice(0, 60);
  return `<div class="hint" style="margin-bottom:8px">匹配 ${hits.length} 道题${hits.length > 60 ? '，最多显示前 60 道' : ''}，点击任意一行直接练这道题。</div>`
    + shown.map(q => {
      const txt = plainStem(q);
      return `<div class="res-item" data-act="practice-one" data-id="${q.id}" style="cursor:pointer">
        <span class="badge">${TYPE_NAME[q.type]}</span>
        <span class="ri-stem">${esc(txt.slice(0, 70))}${txt.length > 70 ? '…' : ''}</span>
        <span class="ri-score" style="color:var(--muted);font-weight:500;font-size:11.5px">${esc(chName(q.chapter))}</span>
      </div>`;
    }).join('');
}

/* ---------------- 6.2 答题页 ---------------- */
function viewQuiz(){
  const s = session;
  if (!s) return `<div class="card"><div class="empty">没有进行中的练习</div></div>`;
  if (s.idx >= s.qs.length) s.idx = s.qs.length - 1;
  const q = s.qs[s.idx];
  const r = s.res[q.id] || (s.res[q.id] = { done:false, pct:null });
  const doneCount = s.qs.filter(x => s.res[x.id] && s.res[x.id].done).length;

  const dots = s.qs.map((x, i) => {
    const rr = s.res[x.id];
    let cls = 'dot';
    if (rr && rr.done) cls += (rr.pct >= 60 ? ' ok' : ' bad');
    if (i === s.idx) cls += ' cur';
    return `<button class="${cls}" data-act="jump" data-i="${i}" title="第 ${i + 1} 题">${i + 1}</button>`;
  }).join('');

  const timerHtml = s.endsAt ? `<span class="timer" id="timer">--:--</span>` : '';

  return `
  <div class="quiz-top">
    <div>
      <div class="quiz-title">${esc(s.title)}</div>
      <div class="quiz-sub">第 ${s.idx + 1} / ${s.qs.length} 题 · 已作答 ${doneCount} 题</div>
    </div>
    ${timerHtml}
    <div style="display:flex;gap:8px;margin-left:auto">
      <button class="btn sm ghost" data-act="open-know" data-ch="${q.chapter}">知识点</button>
      <button class="btn sm ghost" data-act="finish">交卷 / 看结果</button>
    </div>
  </div>
  <div class="progress"><i style="width:${Math.round(doneCount / s.qs.length * 100)}%"></i></div>
  <div class="dots">${dots}</div>

  <div class="card" id="qcard">
    ${renderQuestion(q, r)}
  </div>

  <div class="quiz-nav">
    <button class="btn ghost" data-act="prev" ${s.idx === 0 ? 'disabled' : ''}>← 上一题</button>
    <span class="spacer"></span>
    <span class="hint">${r.done ? '本题已判分，可继续下一题' : '作答后点击按钮判分'}</span>
    <button class="btn primary" data-act="next">${s.idx === s.qs.length - 1 ? '完成并查看结果' : '下一题 →'}</button>
  </div>`;
}

/** 根据题型渲染题目卡（数据库原理 4 种 + Hadoop 新增 7 种） */
function renderQuestion(q, r){
  const diffCls = q.difficulty === '易' ? 'e' : (q.difficulty === '难' ? 'h' : 'm');
  const head = `<div class="q-head">
      <span class="badge">${TYPE_NAME[q.type]}</span>
      <span class="badge gray">${esc(chName(q.chapter))}</span>
      ${q.knowledgePoint ? `<span class="badge kp" title="知识点">${esc(q.knowledgePoint)}</span>` : ''}
      ${q.difficulty ? `<span class="diff ${diffCls}" title="难度">${esc(q.difficulty)}</span>` : ''}
      ${q.title ? `<span class="badge gray b-title">${esc(q.title)}</span>` : ''}
      <span class="pts">满分 100</span>
    </div>
    <div class="q-src">出处 · ${esc(srcOf(q))}${q.referenceUrl ? ` · <a href="${esc(q.referenceUrl)}" target="_blank" rel="noopener">官方文档</a>` : ''}</div>`;

  if (q.type === 'choice') return head + renderChoiceBody(q, r);
  if (q.type === 'term')   return head + renderTermBody(q, r);
  if (q.type === 'fill')   return head + (q.knowledgePoint ? renderHFillBody(q, r) : renderFillBody(q, r));
  if (q.type === 'essay')  return head + renderEssayBody(q, r);
  if (q.type === 'multi')  return head + renderMultiBody(q, r);
  if (q.type === 'match')  return head + renderMatchBody(q, r);
  if (q.type === 'order')  return head + renderOrderBody(q, r);
  if (q.type === 'seq')    return head + renderSeqBody(q, r);
  if (H_TEXT_TYPES.includes(q.type)) return head + renderHTextBody(q, r);
  return head + renderEssayBody(q, r);
}

/* --- 选择题 --- */
/** 统一的「答案详解」面板
 *  opts.answerLine : 正确答案整行（HTML，调用方负责转义）
 *  opts.sel        : 选择题中用户选中的索引，用于把选错的那一项标红
 *  opts.kp         : 没有 CHOICE_DETAIL 时兜底的考点名
 */
function detailPanel(q, opts){
  opts = opts || {};
  /* 新科目（Hadoop）的每道题都带 explanation / source / referenceUrl，
     统一交给 hDetail 渲染，这样单选题也能看到「难度 + 分步详解 + 出处链接」；
     数据库原理的题目没有 explanation，仍走下面原有的 CHOICE_DETAIL 逻辑，行为不变。 */
  if (q.explanation) {
    const extra = opts.answerLine
      ? `<div class="dt-row"><span class="dt-k">答案</span><span class="dt-v">${opts.answerLine}</span></div>`
      : '';
    return hDetail(q, extra);
  }
  const d = CHOICE_DETAIL[q.id];
  const rows = [];
  const kp = (d && d.kp) || opts.kp || chName(q.chapter);
  rows.push(`<div class="dt-row"><span class="dt-k">考点</span><span class="dt-v">${esc(kp)}</span></div>`);
  if (opts.answerLine) {
    rows.push(`<div class="dt-row"><span class="dt-k">答案</span><span class="dt-v">${opts.answerLine}</span></div>`);
  }
  if (q.explain) {
    rows.push(`<div class="dt-row"><span class="dt-k">解析</span><span class="dt-v">${q.explain}</span></div>`);
  }
  if (d && d.why && d.why.length) {
    const lis = d.why.map((w, i) => {
      let cls = '';
      if (i === q.answer) cls = 'hit';
      else if (opts.sel != null && i === opts.sel) cls = 'miss';
      return `<li class="${cls}"><span class="why-k">${'ABCD'[i]}</span><span>${w}</span></li>`;
    }).join('');
    rows.push(`<div class="dt-row"><span class="dt-k">逐项</span><span class="dt-v"><ul class="why-list">${lis}</ul></span></div>`);
  }
  if (d && d.trap) {
    rows.push(`<div class="dt-row"><span class="dt-k">易错</span><span class="dt-v">${d.trap}</span></div>`);
  }
  const link = `<div class="dt-foot"><button class="btn ghost" data-act="open-know" data-ch="${q.chapter}">看本章知识点总结</button></div>`;
  return `<div class="dt">${rows.join('')}</div>${link}`;
}

function renderChoiceBody(q, r){
  const opts = q.options.map((o, i) => {
    let cls = 'opt';
    if (r.done) {
      if (i === q.answer) cls += ' correct';
      else if (i === r.sel) cls += ' wrong';
      cls += ' locked';
    } else if (r.sel === i) cls += ' selected';
    return `<div class="${cls}" data-act="pick" data-i="${i}">
      <span class="opt-key">${'ABCD'[i]}</span><span class="opt-txt">${esc(o)}</span>
    </div>`;
  }).join('');

  const ok = r.pct >= 60;
  const fb = r.done ? `
    <div class="feedback ${ok ? 'fb-ok' : 'fb-bad'}">
      <div class="fb-title">${ok ? '✓ 回答正确' : '✗ 回答错误'}</div>
      <div class="fb-ans">
        正确答案 <b class="ok">${'ABCD'[q.answer]}</b>
        ${r.sel != null && r.sel !== q.answer ? `　·　你的选择 <b class="no">${'ABCD'[r.sel]}</b>` : ''}
      </div>
      ${detailPanel(q, { sel: r.sel, answerLine: `${'ABCD'[q.answer]}. ${esc(q.options[q.answer])}` })}
    </div>` : '';

  return `<div class="stem">${zhTerms(q.stem)}</div>
    <div class="options">${opts}</div>
    ${r.done ? '' : `<div class="essay-tools"><button class="btn primary" data-act="submit-choice" ${r.sel == null ? 'disabled' : ''}>提交答案</button></div>`}
    ${fb}`;
}

/* --- 填空题 --- */
function renderFillBody(q, r){
  const cls = r.done ? (r.pct >= 60 ? 'inp ok' : 'inp bad') : 'inp';
  const ok = r.pct >= 60;
  const fb = r.done ? `
    <div class="feedback ${ok ? 'fb-ok' : 'fb-bad'}">
      <div class="fb-title">${ok ? '✓ 回答正确' : '✗ 回答错误'}</div>
      ${ok ? '' : `<div class="fb-ans">你的答案 <b class="no">${esc(r.draft || '（未填写）')}</b></div>`}
      ${detailPanel(q, { answerLine: `<b>${esc(q.answer)}</b>`, kp: '本章关键概念与语法' })}
    </div>` : '';
  return `<div class="stem">${zhTerms(q.stem)}</div>
    <div class="fill-row">
      <input class="${cls}" id="fillIn" value="${esc(r.draft || '')}" placeholder="在此填写答案，不区分大小写" ${r.done ? 'disabled' : ''} autocomplete="off" />
      ${r.done ? '' : `<button class="btn primary" data-act="submit-fill">提交答案</button>`}
    </div>
    ${fb}`;
}

/* --- 术语填空：缩写 / 全称 / 中文 三行 --- */
function renderTermBody(q, r){
  const rows = r.done && r.termRows ? r.termRows : null;
  const rowOf = k => (rows ? rows.find(x => x.key === k) : null);

  const body = TERM_ROWS.map(spec => {
    /* 已给出的那一行：只展示，不填 */
    if (spec.key === q.given) {
      return `<div class="term-row given">
        <span class="tr-l">${spec.label}</span>
        <span class="tr-v">${esc(q[spec.key])}</span>
        <span class="tr-tag">已给</span>
      </div>`;
    }
    const val = (r.terms || {})[spec.key] || '';
    const one = rowOf(spec.key);
    const cls = 'term-inp inp' + (r.done ? (one && one.ok ? ' ok' : ' bad') : '');
    const ans = (r.done && one && !one.ok)
      ? `<span class="tr-ans">正确答案：${esc(q[spec.key])}</span>` : '';
    return `<div class="term-row">
      <span class="tr-l">${spec.label}</span>
      <span class="tr-in">
        <input class="${cls}" data-term="${spec.key}" value="${esc(val)}" placeholder="${spec.ph}"
               ${r.done ? 'disabled' : ''} autocomplete="off" spellcheck="false" autocapitalize="off" />
        ${ans}
      </span>
    </div>`;
  }).join('');

  const fb = r.done ? (() => {
    const rows = r.termRows || [];
    const asked = rows.filter(x => !x.given);
    const rightN = asked.filter(x => x.ok).length;
    return `
    <div class="feedback ${r.pct >= 60 ? 'fb-ok' : 'fb-bad'}">
      <div class="fb-title">${r.pct >= 60 ? '✓ 回答正确' : '✗ 回答有误'}　答对 ${rightN}/${asked.length} 空（${r.pct}%）</div>
      ${detailPanel(q, {
        kp: '专有名词：缩写 / 英文全称 / 中文名称',
        answerLine: `<b>${esc(q.abbr)}</b>　|　${esc(q.full)}　|　${esc(q.cn)}`
      })}
    </div>`;
  })() : '';

  return `<div class="stem">${zhTerms(q.stem)}</div>
    <div class="term-table">${body}</div>
    ${r.done ? '' : `<div class="essay-tools"><button class="btn primary" data-act="submit-term">提交判分</button></div>`}
    ${fb}`;
}

/* --- 大题 --- */
function renderEssayBody(q, r){
  /* 判断类小问 */
  const partsHtml = (q.parts || []).map((p, i) => {
    if (p.kind === 'choice') {
      const chosen = (r.parts || [])[i];
      const chips = p.options.map((o, j) => {
        let cls = 'chip-opt';
        if (r.done) {
          if (j === p.answer) cls += ' correct';
          else if (j === chosen) cls += ' wrong';
          cls += ' locked';
        } else if (j === chosen) cls += ' selected';
        return `<span class="${cls}" data-act="pick-part" data-i="${i}" data-j="${j}">${esc(o)}</span>`;
      }).join('');
      return `<div class="part">
        <div class="part-q"><b>(${i + 1})</b> ${esc(p.label)} <span class="pts">${p.score} 分</span></div>
        <div class="chips">${chips}</div>
      </div>`;
    }
    return `<div class="part">
      <div class="part-q"><b>(${i + 1})</b> ${esc(p.label)} <span class="pts">${p.score} 分</span></div>
      <div class="fill-row"><input class="inp part-input" data-part="${i}" value="${esc((r.parts || [])[i] || '')}" placeholder="填写答案" ${r.done ? 'disabled' : ''} /></div>
    </div>`;
  }).join('');

  /* 参考答案 / 评分要点面板（受开关控制） */
  let panels = '';
  if (r.showAnswer) {
    panels += `<div class="answer-box"><div class="ab-title">参考答案</div>${esc(q.answer)}${q.answerNote ? `\n\n【补充】${esc(q.answerNote)}` : ''}</div>`;
  }
  if (r.showPoints) {
    const pts = (q.selfCheck || []).map((p, i) => `<div class="r-item"><span class="r-mark" style="background:#94a3b8">${i + 1}</span><span>${esc(p.text)}</span><span class="r-w">${p.score} 分</span></div>`).join('');
    const rb = (q.rubric || []).map(x => `<div class="r-item"><span class="r-mark" style="background:#c7d2fe">•</span><span>${esc(x.label)}</span><span class="r-w">${x.w} 分</span></div>`).join('');
    panels += `<div class="answer-box"><div class="ab-title">评分要点（阅卷 Checklist）</div>
      ${q.parts && q.parts.length ? `<div style="margin-bottom:8px;color:#6b7280">客观小问按标准答案判分；文字部分按下列要点采分。</div>` : ''}
      ${pts}${rb ? `<div style="margin-top:8px;color:#6b7280">语义要点（自动匹配）：</div>${rb}` : ''}
    </div>`;
  }

  /* 判分结果 */
  const fb = r.done ? renderEssayFeedback(q, r) : '';

  return `<div class="stem">${zhTerms(q.stem)}</div>
    ${partsHtml}
    <div class="part" style="margin-top:6px">
      <div class="part-q">作答区（写出 SQL / 关系模式 / 分解过程或文字说明）</div>
      <textarea class="essay-input" id="essayIn" placeholder="在此作答…（判分忽略大小写与多余空格，别名不影响关键字匹配）">${esc(r.draft || '')}</textarea>
    </div>
    <div class="essay-tools">
      ${r.done ? '<button class="btn primary" data-act="regrade">重新判分</button>'
               : '<button class="btn primary" data-act="grade-essay">提交并判分</button>'}
      <button class="btn ghost" data-act="toggle-points">${r.showPoints ? '收起评分要点' : '看评分要点'}</button>
      <button class="btn ghost" data-act="toggle-answer">${r.showAnswer ? '收起参考答案' : '看答案'}</button>
      <button class="btn ghost" data-act="open-know" data-ch="${q.chapter}">看本章知识点</button>
    </div>
    ${fb}
    ${panels}`;
}

/** 大题判分结果区：机器得分 + 要点明细 + 自评 Checklist */
function renderEssayFeedback(q, r){
  const autoMax = r.autoFull != null ? r.autoFull : (r.grade ? r.grade.full : 0);
  const autoGot = r.grade ? r.grade.got : 0;
  const selfMax = (q.selfCheck || []).reduce((a, b) => a + b.score, 0);
  const selfGot = (r.self || []).reduce((a, b, i) => a + (b ? (q.selfCheck[i] ? q.selfCheck[i].score : 0) : 0), 0);
  const totalFull = autoMax + selfMax;
  const totalGot = autoGot + selfGot;
  const pct = totalFull ? Math.round(totalGot / totalFull * 100) : 0;

  const detail = r.grade ? r.grade.detail.map(d => `
    <div class="r-item ${d.ok ? 'r-ok' : 'r-bad'}">
      <span class="r-mark">${d.ok ? '✓' : '·'}</span>
      <span>${esc(d.label)}${(!d.ok && d.hint) ? `<span style="color:#9aa4b2">（参考：${esc(d.hint)}）</span>` : ''}</span>
      <span class="r-w">${d.ok ? '+' : ''}${d.ok ? d.w : 0}/${d.w}</span>
    </div>`).join('') : '';

  const selfBox = selfMax ? `
    <div class="selfcheck-box">
      <div class="sc-head">自测对照：勾选你实际答到的要点（共 ${selfMax} 分，可反复调整）</div>
      ${(q.selfCheck || []).map((it, i) => `
        <label class="sc-item">
          <input type="checkbox" class="selfcheck" data-i="${i}" ${(r.self || [])[i] ? 'checked' : ''} />
          <span>${esc(it.text)}</span><em>${it.score} 分</em>
        </label>`).join('')}
    </div>` : '';

  /* 主观题若尚未自评，给出明确提示：机器只能给要点分，总分需要自评补足 */
  const selfTouched = (r.self || []).some(Boolean);
  const nudge = (selfMax && !selfTouched)
    ? `<div class="fb-warn" id="essayNudge" style="margin:0 0 12px;border-radius:9px;padding:9px 12px;font-size:13px">
         ⚠ 本题含 ${selfMax} 分的自评要点。请对照下方「评分要点」逐条勾选你实际答到的内容，总分才会真实反映你的作答水平。
       </div>`
    : '';

  /* 有自评要点且尚未自评时，用“待完成”的琥珀色，避免全对要点却显示红色错误 */
  const tone = (selfMax && !selfTouched) ? 'fb-warn' : (pct >= 60 ? 'fb-ok' : 'fb-bad');
  return `${nudge}<div class="feedback ${tone}" id="essayFb" data-pct="${pct}">
    <div class="fb-title">机器判分 ${autoGot} / ${autoMax} 分${selfMax ? `　·　自评 ${selfGot} / ${selfMax} 分　·　合计 ${totalGot} / ${totalFull} 分（${pct}%）` : `（${pct}%）`}</div>
    <div class="fb-exp" style="border-top:none;padding-top:4px">
      <div style="font-weight:600;margin-bottom:4px">要点命中情况</div>
      <div class="rubric-list">${detail || '<div class="hint">本题无自动要点</div>'}</div>
    </div>
    ${selfBox}
  </div>`;
}

/* ---------------- 6.3 结果页 ---------------- */
function viewResult(){
  const s = session;
  if (!s) return `<div class="card"><div class="empty">暂无结果</div></div>`;
  const list = s.qs.map((q, i) => {
    const r = s.res[q.id] || {};
    const answeredThis = !!r.done;
    const pct = r.pct == null ? 0 : r.pct;
    const ok = pct >= 60;
    const badge = !answeredThis ? '<span class="badge gray">未答</span>'
                : `<span class="badge ${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'}</span>`;
    return `<div class="res-item" data-act="jump" data-i="${i}" style="cursor:pointer">
      <span class="ri-idx">${i + 1}</span>
      ${badge}
      <span class="ri-stem">${esc(q.title || TYPE_NAME[q.type] + ' · ' + chName(q.chapter))}</span>
      <span class="ri-score" style="color:${!answeredThis ? 'var(--muted)' : (ok ? 'var(--ok)' : 'var(--bad)')}">${answeredThis ? pct + '%' : '—'}</span>
    </div>`;
  }).join('');

  const answered = s.qs.filter(q => s.res[q.id] && s.res[q.id].done).length;
  const sum = s.qs.reduce((a, q) => a + ((s.res[q.id] && s.res[q.id].pct) || 0), 0);
  const avg = s.qs.length ? Math.round(sum / s.qs.length) : 0;
  const wrongCount = s.qs.filter(q => (s.res[q.id] && s.res[q.id].pct) < 60).length;
  const used = Math.max(1, Math.round((Date.now() - s.start) / 60000));

  return `
  <div class="card">
    <div class="score-big">
      <div class="ring" style="--p:${avg}"><div>${avg}<small>得分率</small></div></div>
      <div style="flex:1;min-width:200px">
        <h2 class="card-title" style="margin-bottom:2px">${esc(s.title)}</h2>
        <p class="card-sub" style="margin-bottom:10px">已作答 ${answered} / ${s.qs.length} 题　·　用时约 ${used} 分钟　·　${wrongCount} 题未达标（&lt;60%）</p>
        <div class="btn-row">
          <button class="btn primary" data-act="retry-wrong" ${wrongCount === 0 ? 'disabled' : ''}>重做本卷错题</button>
          <button class="btn ghost" data-act="goto" data-view="home">返回首页</button>
          <button class="btn ghost" data-act="again">再练一次</button>
        </div>
      </div>
    </div>
  </div>
  <div class="card">
    <h2 class="card-title">逐题明细</h2>
    <p class="card-sub">点击任意一行可回到该题查看解析与评分要点。</p>
    <div class="res-list">${list}</div>
  </div>`;
}

/* ---------------- 6.4 错题本（按科目隔离 + 按知识点重做） ---------------- */
function viewWrong(){
  const ids = Object.keys(S.wrong).sort((a, b) => S.wrong[b] - S.wrong[a]);
  const groups = new Map();
  const items = ids.map(id => {
    const q = byId()[id];
    if (!q) return '';
    const rec = S.records[id] || {};
    const kp = kpKeyOf(q);
    if (!groups.has(kp)) groups.set(kp, 0);
    groups.set(kp, groups.get(kp) + 1);
    const txt = plainStem(q);
    return `<div class="wrong-item">
      <div class="wi-head">
        <span class="badge">${TYPE_NAME[q.type]}</span>
        <span class="badge gray">${esc(chName(q.chapter))}</span>

        ${q.difficulty ? `<span class="diff ${q.difficulty === '易' ? 'e' : q.difficulty === '难' ? 'h' : 'm'}">${esc(q.difficulty)}</span>` : ''}
        <span class="hint">答错 ${rec.wrong || 0} 次 · 上次 ${rec.lastPct == null ? '--' : rec.lastPct + '%'}</span>
      </div>

        <button class="btn sm ghost" data-act="remove-wrong" data-id="${id}">移出错题本</button>
      </div>
    </div>`;
  }).join('');

  const kpChips = Array.from(groups.keys()).map(kp =>
    `<button class="k-chip" data-act="start-kp" data-kp="${esc(kp)}">${esc(kp)} · ${groups.get(kp)} 题</button>`
  ).join('');

  return `

    </div>
    ${kpChips ? `<div class="know-top" style="margin-top:12px">${kpChips}</div>` : ''}
  </div>
  <div class="card">
    ${ids.length ? items : '<div class="empty">错题本是空的，继续保持！</div>'}
  </div>`;
}

        ⑤ 难度标为<b>「难」</b>的题多半是参数记忆或细节，看不懂可以先跳过，不影响后面章节。
      </div>
    </div>
    <h3>1. 建议的学习路径</h3>
    <ol>
      <li><b>先看知识点</b>：点顶部「知识点」标签，或点任意章节进入准备页后选「先看知识点总结」。七章讲义 + 考前速查表，含定义、对比表、SQL 模板、易错点与记忆口诀。</li>
      <li><b>再做分章节练习</b>：从准备页点「直接开始练习」，做完每道题都能看到「答案详解」（考点定位 / 详细解析 / 逐项辨析 / 易错提醒）。</li>
      <li><b>最后收口</b>：用随机组卷查漏，用模拟考练时间，把错题本刷干净即可。</li>
    </ol>
    <h3>2. 三种练习方式</h3>
    <ul>
      <li><b>分章节练习</b>：按七大考点逐块突破，题目包含该章全部选择、术语填空、填空与大题。</li>
      <li><b>随机组卷</b>：10 选择 + 10 术语填空 + 8 填空 + 2 大题，共 30 题，每次抽题顺序随机。</li>
      <li><b>模拟考</b>：10 选择 + 10 术语填空 + 6 填空 + 3 大题，60 分钟倒计时，时间到自动交卷。</li>
    </ul>
    <h3>3. 知识点总结怎么看</h3>
    <p>顶部「知识点」标签页是完整的复习讲义，每章分为若干小节，小节内可能包含：</p>
    <ul>
      <li><b>名词对照</b>：一个名词一块，左边术语、右边解释，用来应付名词解释与术语填空。</li>
      <li><b>对比表</b>：三级模式、三类完整性、三级封锁协议、三类故障、范式阶梯等，都是按“考试怎么问”排的。</li>
      <li><b>SQL 模板</b>：连接、分组聚合、嵌套、NOT EXISTS、集合查询六类写法，可直接套用。</li>
      <li><b>提示条</b>（黄色）：该小节最容易考、最容易错的地方。</li>
      <li><b>易错点清单 + 记忆口诀</b>：每章末尾，考前 5 分钟看这一块最划算。</li>
    </ul>
    <p>最后一页是「考前速查表」，把五种码、范式阶梯、三级封锁协议、三类故障、关系代数符号、SQL 子句职责、术语缩写压缩成 7 张表。</p>
    <h3>4. 「答案详解」包含什么</h3>
    <ul>
      <li><b>考点</b>：这道题对应哪个知识点，方便回知识点页面定位。</li>
      <li><b>答案</b>：正确答案的完整表述（术语题会给出「缩写 | 全称 | 中文」三件套）。</li>
      <li><b>解析</b>：为什么是这个答案，涉及的定义与规则。</li>
      <li><b>逐项</b>：选择题的四个选项<b>逐个</b>说明对在哪里、错在哪里；选错的那一项会标红，正确项标绿。</li>
      <li><b>易错</b>：本题最常见的错法，以及如何避免。</li>
      <li><b>看本章知识点总结</b>：一键跳到对应章节的讲义，看完还能「返回练习」继续作答。</li>
    </ul>
    <h3>5. 题库来源</h3>
    <p>题目按 <b>王珊、萨师煊《数据库系统概论》（第 5 版，高等教育出版社）</b> 的章节体系与术语规范组织，
    覆盖课程教材第 1~7、10~11 章的核心考点；每道题卡片上方都标注了对应章节出处。知识点讲义同样按该教材的章节顺序编排。</p>
    <ul>
      <li>第 1 章 绪论 —— 基础概念（DB/DBMS/DBS/DBA、三级模式、数据独立性、C/S 与 B/S）</li>
      <li>第 2 章 关系数据库 —— 关系运算（σ/π/∪/∩/−/⋈/×）、元组/属性/域、码与三类完整性</li>
      <li>第 3 章 关系数据库标准语言 SQL —— DDL/DML/DCL、连接与嵌套查询、分组聚合、视图、索引</li>
      <li>第 4~5 章 安全性、完整性 —— 授权与回收、DAC/MAC/RBAC、实体/参照/用户定义完整性、触发器</li>
      <li>第 6 章 关系数据理论 —— 函数依赖、1NF~4NF、闭包、最小覆盖、无损连接与保持依赖</li>
      <li>第 7 章 数据库设计 —— E-R 图三要素、概念设计转关系模式、六大设计阶段</li>
      <li>第 10~11 章 恢复技术与并发控制 —— ACID、封锁协议、2PL、意向锁、可串行化、日志与检查点</li>
    </ul>
    <p>术语填空部分的 41 个缩写全部取自上述章节（DB、DBS、DBMS、DBA、DDL、DML、DCL、TCL、SQL、RDB、RDBMS、C/S、B/S、ODBC、JDBC、PK、FK、CK、SK、E-R、FD、MVD、NF、1NF~4NF、BCNF、ACID、2PL、2PC、S/X/IS/IX/SIX 锁、WAL、CKPT、DAC、MAC、RBAC），涵盖课程教材中常考的专有名词缩写。</p>
    <h3>6. 术语填空怎么判分</h3>
    <p>每题固定三行：<b>英文缩写 / 英文全称 / 中文名称</b>，题面会给出其中一项，其余两行自己写（少数题目三项全填）。按空平均给分：两空题答对一个得 50%，三空题答对两个得 67%；得分率 ≥ 60% 记为答对。</p>
    <p>判分时忽略大小写、空格、连字符、斜杠与中英文标点，所以 <code>Boyce-Codd Normal Form</code> 与 <code>boyce codd normal form</code> 等价；<code>S</code> 与 <code>S锁</code>、<code>BC范式</code> 与 <code>BC 范式</code> 也都算对。但<b>不做包含匹配</b>，写 <code>DB</code> 不会被判成 <code>DBMS</code>。</p>
    <h3>7. 判分规则</h3>
    <ul>
      <li><b>选择题</b>：点击选项后提交，立即判分并显示解析。</li>
      <li><b>填空题</b>：忽略大小写、空格与中英文标点，支持多个等价答案（如「2NF / 第二范式」）。</li>
      <li><b>SQL 大题</b>：忽略大小写、多余空格与表别名，按「关键字 + 逻辑结构」逐条要点匹配给分（要点命中即得分，漏点只扣该点分值）。</li>
      <li><b>范式 / 并发大题</b>：小题（候选码、范式等级等）直接对标准答案判分；文字部分仍按要点匹配，最后可用 Checklist 自评补分。</li>
      <li><b>E-R 等主观题</b>：机器按关键词给出参考分，再用「评分要点」逐项自评，合计为最终得分。</li>
    </ul>
    <h3>8. 进度保存</h3>
    <p>作答记录、错题本、得分与已练章节均写入 <code>localStorage</code>，刷新或关闭浏览器不会丢失。答对后题目会自动移出错题本。</p>
    <h3>9. 如何增删题目与知识点</h3>
    <p><b>加题</b>：用任意文本编辑器打开本文件，找到 <code>const CHOICE / TERM / FILL / ESSAY</code> 四个数组，按现有结构追加或删除对象即可，刷新页面即生效。字段说明见脚本顶部注释。</p>
    <p><b>加选择题详解</b>：在 <code>CHOICE_DETAIL</code> 里按 id 追加一条 <code>{ kp:'考点', why:['A…','B…','C…','D…'], trap:'易错提醒' }</code>，就会在答案区显示考点、逐项辨析与易错提醒；不写也照常判分，只是少这几块。</p>
    <p><b>改知识点</b>：找到 <code>const KNOW</code>，每章是一个对象，<code>sections</code> 里每个小节支持 <code>h</code>（标题）、<code>p</code>（段落）、<code>kv</code>（名词对照）、<code>table</code>（对比表）、<code>ul</code>（要点）、<code>code</code>（代码块）、<code>tip</code>（黄色提示条）七种字段，随意组合；<code>traps</code> 是易错点清单，<code>mnemo</code> 是记忆口诀。</p>
    <h3>10. 判定为「答对」的标准</h3>
    <p>单题得分率 ≥ 60% 记为答对；大题按要点加权，部分正确也会得到相应比例分数。</p>
    <h3>11. 三个科目怎么切换、数据怎么隔离</h3>
    <ul>
      <li>首页是<b>科目选择页</b>：点「数据库原理」「Hadoop 生态」或「数据结构」进入对应科目；顶栏右侧「切换科目」随时返回。</li>
      <li>进度、错题、得分<b>按科目独立保存</b>：数据库原理用 <code>db_quiz_state_v1</code>（沿用原键名），Hadoop 用 <code>hadoop_quiz_state_v1</code>，数据结构用 <code>ds_quiz_state_v1</code>。</li>
      <li>在统计页点「清空本科目练习数据」只影响当前科目，其他科目的错题与进度不会丢。</li>
      <li>各科目共用同一套判分引擎，但题库、章节、知识点、速查表各自独立。</li>
    </ul>
    <h3>12. Hadoop 题库的题型与判分</h3>
    <ul>
      <li><b>choice 单选</b>：精确匹配，提交后立即判分。</li>
      <li><b>multi 多选</b>：全部选对才得满分，反馈会指出漏选与错选。</li>
      <li><b>fill 填空</b>：忽略大小写、空格与中英文标点，支持多个等价答案。</li>
      <li><b>cmd 命令填空</b>：忽略多余空格与结尾分号，先比对标准命令，再按关键词给分。</li>
      <li><b>code 代码填空</b>：忽略空格、分号、<code>new/var/final</code> 与泛型尖括号写法差异，按采分点命中比例给分。</li>
      <li><b>sql HiveQL</b>：忽略大小写、多余空格与表别名，按「关键词 + 逻辑结构」逐条匹配。</li>
      <li><b>match 组件匹配</b>：左右比对，按配对正确的数量给部分分，并逐项给出正确配对。</li>
      <li><b>order 流程排序</b>：为每一步选择序号，判分时指出错位步骤并给出正确顺序。</li>
      <li><b>fix 纠错</b>：按采分点给分，同时展示改正后的完整代码。</li>
      <li><b>text 简答</b>：按评分要点关键词命中比例给分，并展示参考答案与官方文档链接。</li>
    </ul>
    <h3>13. Hadoop 题库的来源</h3>
    <p>题目与默认参数以 <b>Apache 官方文档</b> 为准：HDFS Architecture / HDFS Users Guide / FileSystem Shell / MapReduce Tutorial / mapred-default.xml / YARN / Capacity Scheduler / Hive Language Manual / HBase Reference Guide / ZooKeeper Programmer's Guide / Flume User Guide / Kafka Documentation / Spark RDD Programming Guide；个别结论参考 O'Reilly《Hadoop: The Definitive Guide》。</p>
    <p><b>关于 Secondary NameNode：</b>官方已明确标注其废弃（deprecated），由 Checkpoint Node / Backup Node 接替。本库把它单独放在「过时考点（了解即可）」分类，只考查「它是什么、为什么被废弃、现行方案是什么」，不把它当作现行正确机制。HA 集群中 Standby NameNode 本身会做检查点，不需要也不应该再部署 SNN / Checkpoint / Backup。</p>
    <h3>14. 数据结构题库的题型与判分</h3>
    <ul>
      <li><b>choice 单选</b>：精确匹配，提交即判分，详解里给出该选项为什么对、其余为什么错。</li>
      <li><b>multi 多选</b>：全部选对才满分，反馈指出<b>漏选</b>与<b>错选</b>。</li>
      <li><b>fill 填空</b>：忽略大小写、空格与中英文标点，支持多个等价写法（如「头结点 / 头节点」）。</li>
      <li><b>seq 序列填空（本库新增）</b>：答案本身是一串有序记号时使用，例如遍历序列、后缀表达式、next 数组、哈希下标、每一趟排序结果。用空格或逗号分隔每个记号，判分时<b>逐位置比对</b>——
        对几个位置就给几分的比例分，反馈表会逐行列出「标准答案 / 你的作答 / 对错」，因此即使整串没写全，也能立刻看出是第几步算错。
        <b>容错</b>：大小写、空格、括号、<code>^</code> 与上下标（<code>O(n²)</code> 与 <code>O(n^2)</code>）都视为相同；若某个记号内部带了空格（如 <code>O(log n)</code>），会自动合并后再比对。</li>
      <li><b>code C 语言算法填空</b>：按采分点给分，忽略空格、分号与注释差异，展示参考答案代码。</li>
      <li><b>match 术语匹配</b>：左右配对（下拉选择），按配对正确数给部分分，并逐项给出正确配对。</li>
      <li><b>order 步骤排序</b>：为每一步选择序号，判分时指出错位步骤并给出正确顺序。</li>
      <li><b>text 简答</b>：按评分要点关键词命中比例给分，并展示参考答案与教材出处。</li>
    </ul>
    <h3>15. 数据结构题库的来源</h3>
    <p>章节体系、术语口径与判分标准以 <b>李冬梅、严蔚敏、吴伟民《数据结构（C语言版）》第 3 版（人民邮电出版社 2024，ISBN 978-7-115-65125-9）</b> 为准。第 3 版共 <b>8 章</b>：绪论、线性表、栈和队列、串/数组和广义表、树和二叉树、图、查找、排序（外部排序在 8.7 节），本库按此 8 章组织，<b>没有选学章</b>。</p>
    <p><b>与旧版（清华 1997 年 12 章版）的对照</b>：旧版把「串」与「数组和广义表」分作第 4、5 章、「内部排序」与「外部排序」分作第 10、11 章，另有第 8 章「动态存储管理」与第 12 章「文件」。本库合并后——<b>旧第 9 章（查找）= 第 3 版第 7 章</b>，<b>旧第 10、11 章（内/外部排序）= 第 3 版第 8 章</b>，旧第 6 章（树）= 第 3 版第 5 章，旧第 7 章（图）= 第 3 版第 6 章。手上有旧版教材时按这张表换算即可。</p>
    <p><b>第 3 版新增考点</b>：5.8 并查集（双亲表示、按秩合并 + 路径压缩、O(α(n))）、7.3.3 红黑树（五条性质、与 AVL 的取舍）、7.3.5 B+ 树（叶子链表与范围查询）、8.4.2 树形选择排序。这四块均已单独出题，旧版教材里没有，需要额外补充。</p>
    <p>每题的「出处」都写明第 3 版的章与节（如「第 5 章 5.7 哈夫曼树及其应用」「第 8 章 8.7.2 多路平衡归并的实现」），并附一个可点开的核对链接（OI Wiki），用于确认定义与公式；教材本身没有网页版，因此书名条目不带链接。</p>
    <p><b>关于默认口径：</b>教材的 <code>next[1] = 0</code>、栈顶指针 <code>top</code> 指向栈顶元素、循环队列牺牲一个单元、大根堆升序、AOE 网 ve/vl 的计算方向等约定，全部按教材原文出题；题目里若存在另一种常见约定（如 <code>next[0] = -1</code>），会在详解中一并说明。</p>

    <h3>18. 如何加新科目 / 新题目</h3>
    <p><b>加科目</b>：在脚本中新增一份题库数组（每题带 <code>type / chapter / knowledgePoint / tags / difficulty / explanation / source / referenceUrl</code>），然后在 <code>SUBJECTS</code> 里加一项，挂上 <code>chapters / bank / byId / know / knowNav</code> 和独立的 <code>storeKey</code> 即可，首页会自动多出科目卡片。</p>

/* ================================================================
   6.9 Hadoop 新题型渲染与判分
   ----------------------------------------------------------------
   统一约定：
     · choice / fill 复用原有逻辑（fill 只是换成 Hadoop 详解面板）
     · multi  : 全对才满分，反馈里指出漏选 / 错选
     · cmd    : 忽略多余空格与结尾分号，先比对标准命令，再按关键词给分
     · code   : 忽略空格、分号、new/var/final、泛型写法差异
     · sql    : 归一化后按 rubric 正则做「关键词 + 逻辑结构」匹配
     · match  : 逐对比较，按配对正确数给部分分
     · order  : 逐项比较位置，指出错位步骤并给出正确顺序
     · fix    : 同 code，按采分点给分，并展示改正后的完整代码
     · text   : 按采分点关键词命中比例给分，展示评分要点与参考答案
   ================================================================ */
const H_TEXT_TYPES = ['cmd', 'code', 'sql', 'fix', 'text'];

/** 命令归一化：去结尾分号、压缩空格、等号两侧不敏感 */
function normCmd(raw){
  return toHalf(raw || '')
    .trim()
    .toLowerCase()
    .replace(/\s*[;；]\s*$/, '')
    .replace(/\s+/g, ' ')
    .replace(/\s*=\s*/g, '=')
    .trim();
}

/** 代码归一化：去注释、去泛型尖括号、去 new/var/final、去空格与分号、统一引号 */
function normCode(raw){
  let t = toHalf(raw || '').toLowerCase();
  t = t.replace(/\/\*[\s\S]*?\*\//g, ' ');
  t = t.replace(/\/\/[^\n]*/g, ' ');
  t = t.replace(/<[^>]*>/g, '');
  t = t.replace(/\bnew\b/g, '').replace(/\bvar\b/g, '').replace(/\bfinal\b/g, '');
  t = t.replace(/[;\s]+/g, '');
  t = t.replace(/["']/g, '"');
  return t;
}

/** 通用「采分点」判分：q.keys = [{label, any:[写法...]}] */
function gradeKeys(q, raw, normFn){
  const groups = q.keys || [];
  const full = groups.length || 1;
  const text = normFn(raw || '');
  if (!text.replace(/[\s;；]/g, '').length) {
    return { pct:0, got:0, full, empty:true, detail:groups.map(g => ({ label:g.label, w:1, ok:false })) };
  }
  /* 与标准答案完全一致（归一化后）直接满分，避免个别写法没写进 keys 被误杀 */
  const exact = (q.accept || []).some(a => normFn(a) === text);
  let hit = 0;
  const detail = groups.map(g => {
    const ok = exact || g.any.some(k => text.includes(normFn(k)));
    if (ok) hit++;
    return { label:g.label, w:1, ok };
  });
  return { pct: exact ? 100 : Math.round(hit / full * 100), got: exact ? full : hit, full, exact, detail };
}

/** HiveQL 判分：归一化（去别名、去分号、压空格）后按 rubric 正则匹配 */
function gradeRubricQ(q, raw){
  const text = stripAlias(normSQL(raw || ''));
  let got = 0, full = 0;
  const detail = (q.rubric || []).map(r => {
    const ok = text.length > 0 && hitRubric(r, text);
    if (ok) got += r.w;
    full += r.w;
    return { label:r.label, w:r.w, ok };
  });
  return { pct: full ? Math.round(got / full * 100) : 0, got, full, detail };
}

/** 多选：全对才 100%，否则 0 */
function gradeMulti(q, sel){
  const chosen = Array.isArray(sel) ? sel.slice().sort((a, b) => a - b) : [];
  const right = q.answer.slice().sort((a, b) => a - b);
  const ok = chosen.length > 0 && chosen.join(',') === right.join(',');
  return { pct: ok ? 100 : 0, got: ok ? 1 : 0, full: 1, detail:[{ label:'全部选对（不漏选、不错选）', w:1, ok }] };
}

/** 组件匹配：按配对正确的数量给部分分 */
function gradeMatch(q, sel){
  const detail = q.left.map((l, i) => {
    const chosen = (sel || [])[i];
    return {
      label: `${l} → ${q.right[q.answer[i]]}`,
      w: 1,
      ok: chosen === q.answer[i],
      right: q.answer[i],
      chosen: (chosen === 0 || chosen) ? chosen : null
    };
  });
  const got = detail.filter(d => d.ok).length;
  return { pct: Math.round(got / q.left.length * 100), got, full: q.left.length, detail };
}

/** 流程排序：steps 本身是正确顺序，_view 是展示顺序；比较每一步被赋予的序号 */
function ensureOrderView(q){
  if (!Array.isArray(q._view)) {
    const idx = q.steps.map((_, i) => i);
    let v = shuffle(idx);
    if (v.length > 1 && v.every((x, i) => x === i)) v = v.slice(1).concat(v[0]);
    q._view = v;
  }
  return q._view;
}
function gradeOrder(q, ord){
  const v = ensureOrderView(q);
  const detail = v.map((stepIdx, slot) => {
    const right = stepIdx + 1;
    const chosen = (ord || [])[slot];
    return { label: q.steps[stepIdx], w: 1, ok: chosen === right, right, chosen };
  });
  const got = detail.filter(d => d.ok).length;
  return { pct: Math.round(got / v.length * 100), got, full: v.length, detail };
}


/* ---------------- 英文术语中文化：首次出现补中文注解 ----------------
 * 目的：题干里出现 RecordReader、ResourceManager 这类词时，旁边直接给中文。
 * 规则：只处理 Hadoop 科目、只处理长度 >= 3 且不含空格的词、每个题干最多注 3 个、
 *       已有「（中文）」的不重复注。插入的是纯文本括号，不影响判分（判分读 q.answer）。
 */
const H_TERM_MAP = (() => {
  const m = {};
  (typeof H_TERMS !== 'undefined' ? H_TERMS : []).forEach(t => {
    if (!t || !t.en || !t.cn) return;
    if (t.en.length < 3 || /[()\s\/]/.test(t.en)) return;
    if (!(t.en in m)) m[t.en] = t.cn;
  });
  return m;
})();
const H_TERM_KEYS = Object.keys(H_TERM_MAP).sort((a, b) => b.length - a.length);

function zhTerms(text){
  let out = String(text == null ? '' : text);
  if (typeof CUR_SUB !== 'undefined' && CUR_SUB !== 'hadoop') return out;
  if (!out) return out;
  let used = 0;
  for (let i = 0; i < H_TERM_KEYS.length && used < 3; i++) {
    const k = H_TERM_KEYS[i];
    const safe = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(^|[^A-Za-z0-9_])(' + safe + ')(?![A-Za-z0-9_])');
    const m = re.exec(out);
    if (!m) continue;
    const at = m.index + m[1].length;
    const after = out.slice(at + k.length, at + k.length + 1);
    if (after === '（' || after === '(') continue;
    out = out.slice(0, at + k.length) + '（' + H_TERM_MAP[k] + '）' + out.slice(at + k.length);
    used++;
  }
  return out;
}
