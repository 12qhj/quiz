/* ================================================================
   序列填空（seq）—— 数据结构科目新增题型
   ----------------------------------------------------------------
   适用：答案本身就是「一串有序记号」的题，例如
     · 复杂度由低到高：O(1) O(logn) O(n) O(nlogn) O(n²) O(2ⁿ)
     · 后缀表达式：    A B + C * D E / -
     · 遍历序列：      A B D E C F
     · 一行手算结果：  49 13 27 49 76 38 65 97
   判分：把答案与作答都切成记号，按「位置」逐个比对，位置对的得分，
         因此漏写、多写、错位都会体现在具体位置上，便于定位是哪一步算错。
   ================================================================ */

/**
 * 记号归一化（比 normText 更宽松，但不能吃掉运算符）：
 *   全角转半角 → 小写 → 去空白 → 去括号 → 去 ^ → 上下标转普通字符
 * 这样 O(n²)、O(n^2)、o(n2) 都等价，且 + - * / 不会被误删。
 */
function normToken(s){
  return toHalf(String(s == null ? '' : s))
    .toLowerCase()
    .replace(/\s+/g, '')
    .replace(/[（）()\[\]【】{}]/g, '')
    .replace(/\^/g, '')
    .replace(/⁰/g, '0').replace(/¹/g, '1').replace(/²/g, '2')
    .replace(/³/g, '3').replace(/⁴/g, '4').replace(/⁵/g, '5')
    .replace(/⁶/g, '6').replace(/⁷/g, '7').replace(/⁸/g, '8')
    .replace(/⁹/g, '9').replace(/ⁿ/g, 'n')
    .replace(/[，,、；;。．.]/g, '');
}

/** 切成记号：逗号 / 顿号 / 分号 / 空白 都算分隔符 */
function seqTokens(raw){
  return toHalf(String(raw == null ? '' : raw))
    .replace(/[，,、；;]/g, ' ')
    .split(/\s+/)
    .map(x => x.trim())
    .filter(Boolean);
}

/**
 * 对齐：作答的记号个数与标准答案不一致时，尽量把它们对齐后再逐位比对。
 *   · 个数相同        → 直接逐位对应
 *   · 作答少了        → 后面补 null（判为未写）
 *   · 作答多了        → 贪心合并相邻记号（应对「O(log n)」被空格切成两段）
 */
function alignTokens(userToks, ansToks){
  const n = ansToks.length, m = userToks.length;
  if (!m) return new Array(n).fill(null);
  if (m === n) return userToks.slice();
  if (m < n) return userToks.concat(new Array(n - m).fill(null));

  const out = [];
  let i = 0;
  for (let j = 0; j < n; j++) {
    if (j === n - 1) { out.push(userToks.slice(i).join('')); break; }
    const remain = m - i;          // 还剩多少记号可用
    const need = n - j;            // 还剩多少个位置要填
    let take = 1;
    /* 优先找一个能让当前位直接命中的合并长度 */
    for (let k = 1; k <= remain - need + 1; k++) {
      if (normToken(userToks.slice(i, i + k).join('')) === normToken(ansToks[j])) { take = k; break; }
    }
    out.push(userToks.slice(i, i + take).join(''));
    i += take;
  }
  return out;
}

/** 序列填空判分：逐位置比对，按命中位置数给分 */
function gradeSeq(q, raw){
  const ansToks = seqTokens(q.answer);
  const userToks = seqTokens(raw);
  const got = alignTokens(userToks, ansToks);
  const detail = ansToks.map((ans, i) => {
    const u = got[i];
    return {
      label: `第 ${i + 1} 位`,
      w: 1,
      ok: u != null && normToken(u) === normToken(ans),
      right: ans,
      chosen: (u == null || u === '') ? null : u
    };
  });
  const hit = detail.filter(d => d.ok).length;
  const full = ansToks.length || 1;
  return {
    pct: Math.round(hit / full * 100),
    got: hit,
    full,
    empty: userToks.length === 0,
    tooMany: userToks.length > ansToks.length,
    detail
  };
}

function renderSeqBody(q, r){
  const g = r.grade;
  const cls = r.done ? (r.pct >= 60 ? 'inp ok' : 'inp bad') : 'inp mono';
  const hint = q.hint || '用空格或逗号分隔每个记号';

  let rows = '';
  if (r.done && g && g.detail) {
    rows = g.detail.map(d => {
      const shown = d.chosen == null ? '（未写）' : d.chosen;
      return `<div class="seq-row ${d.ok ? 'sq-ok' : 'sq-bad'}">
        <span class="sq-pos">${esc(d.label)}</span>
        <span class="sq-ans">${esc(d.right)}</span>
        <span class="sq-you">${esc(shown)}</span>
        <span class="sq-mark">${d.ok ? '✓' : '✗'}</span>
      </div>`;
    }).join('');
  }

  const fb = r.done ? `
    <div class="feedback ${r.pct >= 60 ? 'fb-ok' : 'fb-bad'}">
      <div class="fb-title">${r.pct >= 60 ? '✓ 序列基本正确' : '✗ 序列有误'}　正确 ${g.got}/${g.full} 个位置（${r.pct}%）</div>
      <div class="fb-ans">参考答案 <b class="ok">${esc(q.answer)}</b>${r.pct < 60 ? `　·　你的作答 <b class="no">${esc(r.draft || '（未填写）')}</b>` : ''}</div>
      ${g.empty ? '<div class="fb-ans">没有检测到任何记号——请用空格或逗号把每个记号分开。</div>' : ''}
      ${g.tooMany ? '<div class="fb-ans">作答的记号比标准答案多，已自动合并比对；若仍有偏差，请检查是否多了逗号或括号。</div>' : ''}
      <div class="seq-table"><div class="seq-head"><span class="sq-pos">位置</span><span class="sq-ans">标准答案</span><span class="sq-you">你的作答</span><span class="sq-mark"></span></div>${rows}</div>
      <div class="hint">逐位置给分：对几个位置就得几分，所以即使记不全，也能看出具体是哪一步算错了。</div>
      ${hDetail(q)}
    </div>` : '';

  return `<div class="stem">${zhTerms(q.stem)}</div>
    <div class="fill-row">
      <input class="${cls}" id="hIn" value="${esc(r.draft || '')}" placeholder="按顺序写出每个记号，用空格或逗号分隔" ${r.done ? 'disabled' : ''} autocomplete="off" autocapitalize="off" spellcheck="false" />
      ${r.done ? '' : '<button class="btn primary" data-act="submit-hq">提交答案</button>'}
    </div>
    <div class="hint">${esc(hint)}</div>
    ${fb}`;
}

/* ---------------- 提交判分（新题型统一入口） ---------------- */
function submitHQ(){
  const q = curQ(), r = curR();
  if (!q || r.done) return;
  syncDraft();
  let g;
  if (q.type === 'multi')       g = gradeMulti(q, r.sel || []);
  else if (q.type === 'match')  g = gradeMatch(q, r.match || []);
  else if (q.type === 'order')  g = gradeOrder(q, r.order || []);
  else if (q.type === 'sql')    g = gradeRubricQ(q, r.draft || '');
  else if (q.type === 'cmd')    g = gradeKeys(q, r.draft || '', normCmd);
  else if (q.type === 'text')   g = gradeKeys(q, r.draft || '', normText);
  else if (q.type === 'seq')    g = gradeSeq(q, r.draft || '');
  else                          g = gradeKeys(q, r.draft || '', normCode); // code / fix
  r.done = true;
  r.grade = g;
  r.pct = g.pct;
  markResult(q.id, g.pct, false);
  render();
}

/* ================================================================
   7. 交互逻辑
   ================================================================ */

/* ---- 计时器（仅模拟考） ---- */
function ensureTimer(){
  if (timerId) { clearInterval(timerId); timerId = null; }
  if (view !== 'quiz' || !session || !session.endsAt) return;
  const tick = () => {
    const left = Math.max(0, Math.round((session.endsAt - Date.now()) / 1000));
    const el = document.getElementById('timer');
    if (el) el.textContent = fmtTime(left);
    if (left <= 0) {
      clearInterval(timerId); timerId = null;
      finishSession(true);
    }
  };
  tick();
  timerId = setInterval(tick, 500);
}

/* ---- 当前题目的作答对象 ---- */
function curQ(){ return session ? session.qs[session.idx] : null; }
function curR(){ const q = curQ(); return q ? (session.res[q.id] || (session.res[q.id] = {})) : {}; }

/* ---- 保存草稿（切换题目/重新渲染前调用，避免输入丢失） ---- */
function syncDraft(){
  const q = curQ();
  if (!q) return;
  const r = session.res[q.id] || (session.res[q.id] = {});
  if (q.type === 'fill') {
    const el = document.getElementById('fillIn');
    if (el && !r.done) r.draft = el.value;
  } else if (q.type === 'term') {
    if (!r.done) {
      const vals = {};
      document.querySelectorAll('.term-inp').forEach(inp => { vals[inp.dataset.term] = inp.value; });
      if (Object.keys(vals).length) r.terms = Object.assign(r.terms || {}, vals);
    }
  } else if (q.type === 'essay') {
    const el = document.getElementById('essayIn');
    if (el && !r.done) r.draft = el.value;
    document.querySelectorAll('.part-input').forEach(inp => {
      if (!r.parts) r.parts = [];
      r.parts[Number(inp.dataset.part)] = inp.value;
    });
  } else if (H_TEXT_TYPES.includes(q.type)) {
    /* cmd / code / sql / fix / text：共用 #hIn 输入区 */
    const el = document.getElementById('hIn');
    if (el && !r.done) r.draft = el.value;
  } else if (q.type === 'match' && !r.done) {
    const arr = [];
    document.querySelectorAll('[data-mi]').forEach(sel => {
      arr[Number(sel.dataset.mi)] = sel.value === '' ? null : Number(sel.value);
    });
    if (arr.length) r.match = arr;
  } else if (q.type === 'order' && !r.done) {
    const arr = [];
    document.querySelectorAll('[data-oi]').forEach(sel => {
      arr[Number(sel.dataset.oi)] = sel.value === '' ? null : Number(sel.value);
    });
    if (arr.length) r.order = arr;
  } else if (q.type === 'seq') {
    /* 序列填空：与 cmd 一样用单行输入 #hIn */
    const el = document.getElementById('hIn');
    if (el && !r.done) r.draft = el.value;
  }
}

/* ---- 提交判分 ---- */
function submitChoice(){
  const q = curQ(), r = curR();
  if (!q || r.done || r.sel == null) return;
  const ok = r.sel === q.answer;
  r.done = true;
  r.pct = ok ? 100 : 0;
  markResult(q.id, r.pct, false);
  render();
}
function submitFill(){
  const q = curQ(), r = curR();
  if (!q || r.done) return;
  syncDraft();
  const ok = matchText(r.draft, q.accept);
  r.done = true;
  r.pct = ok ? 100 : 0;
  markResult(q.id, r.pct, false);
  render();
}
/* 术语填空：缩写 / 全称 / 中文 按空判分 */
function submitTerm(){
  const q = curQ(), r = curR();
  if (!q || r.done) return;
  syncDraft();
  const g = gradeTerm(q, r.terms || {});
  r.done = true;
  r.termRows = g.rows;     // 逐行对错快照，供反馈着色
  r.pct = g.pct;
  markResult(q.id, r.pct, false);
  render();
}
function gradeEssayQ(){
  const q = curQ(), r = curR();
  if (!q) return;
  syncDraft();
  const g = gradeEssay(q, r.draft || '', r.parts || []);
  const selfMax = (q.selfCheck || []).reduce((a, b) => a + b.score, 0);
  const selfGot = (r.self || []).reduce((a, b, i) => a + (b ? q.selfCheck[i].score : 0), 0);
  const totalFull = g.full + selfMax;
  const totalGot = g.got + selfGot;
  r.done = true;
  r.grade = g;
  r.autoFull = g.full;
  r.pct = totalFull ? Math.round(totalGot / totalFull * 100) : 0;
  markResult(q.id, r.pct, false);
  render();
}

/* ---- 大题自评修改后重算总分 ---- */
function updateSelfScore(idx, checked){
  const q = curQ(), r = curR();
  if (!q || !r.grade) return;
  if (!r.self) r.self = [];
  r.self[idx] = checked;
  const selfMax = (q.selfCheck || []).reduce((a, b) => a + b.score, 0);
  const selfGot = r.self.reduce((a, b, i) => a + (b ? q.selfCheck[i].score : 0), 0);
  const totalFull = r.grade.full + selfMax;
  const totalGot = r.grade.got + selfGot;
  const pct = totalFull ? Math.round(totalGot / totalFull * 100) : 0;
  r.pct = pct;
  markResult(q.id, pct, true);

  /* 就地更新提示文字，避免整页重绘导致滚动跳动 */
  const fb = document.getElementById('essayFb');
  if (fb) {
    fb.dataset.pct = pct;
    fb.classList.remove('fb-warn');
    fb.classList.toggle('fb-ok', pct >= 60);
    fb.classList.toggle('fb-bad', pct < 60);
    const t = fb.querySelector('.fb-title');
    if (t) t.textContent = `机器判分 ${r.grade.got} / ${r.grade.full} 分　·　自评 ${selfGot} / ${selfMax} 分　·　合计 ${totalGot} / ${totalFull} 分（${pct}%）`;
  }
  updateHeader();
  /* 首次自评后隐藏“请自评”提示 */
  if (checked) {
    const nd = document.getElementById('essayNudge');
    if (nd && nd.parentNode) nd.parentNode.removeChild(nd);
  }
  /* 更新题号点状态 */
  const dots = document.querySelectorAll('.dot');
  if (dots[session.idx]) {
    dots[session.idx].classList.toggle('ok', pct >= 60);
    dots[session.idx].classList.toggle('bad', pct < 60);
  }
}

/* ---- 结束本次练习 ---- */
function finishSession(auto){
  if (!session) return;
  syncDraft();
  const answered = session.qs.filter(q => session.res[q.id] && session.res[q.id].done).length;
  /* 完全没作答时不允许交卷，避免产生无意义的 0 分记录 */
  if (!auto && answered === 0) {
    alert('还没有作答任何题目，先做一题再交卷吧～');
    return;
  }
  if (timerId) { clearInterval(timerId); timerId = null; }
  const sum = session.qs.reduce((a, q) => a + ((session.res[q.id] && session.res[q.id].pct) || 0), 0);
  const pct = session.qs.length ? Math.round(sum / session.qs.length) : 0;
  if (answered > 0) {
    S.sessions.push({ ts: Date.now(), mode: session.mode, title: session.title, pct, total: session.qs.length, answered });
    if (S.sessions.length > 50) S.sessions = S.sessions.slice(-50);
    saveState();
  }
  view = 'result';
  window.scrollTo(0, 0);
  render();
  if (auto) setTimeout(() => alert('考试时间到，已自动交卷。'), 60);
}

/* ---- 导航 ---- */
function gotoQuestion(i){
  if (!session) return;
  syncDraft();
  session.idx = Math.max(0, Math.min(session.qs.length - 1, i));
  view = 'quiz';
  window.scrollTo(0, 0);
  render();
}

/* ================================================================
   8. 事件委托
   ================================================================ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;

  switch (act) {
    /* --- 导航 / 模式 --- */
    case 'goto':
      if (view === 'quiz' && session) syncDraft();
      view = t.dataset.view;
      window.scrollTo(0, 0);
      render();
      break;
    case 'start-chapter': startChapter(t.dataset.ch); break;
    /* 章节准备页：先给「看知识点 / 直接练」的选择 */
    case 'open-chapter':
      if (view === 'quiz' && session) syncDraft();
      chapterId = t.dataset.ch || chapterId;
      view = 'chapter';
      window.scrollTo(0, 0);
      render();
      break;
    /* 知识点总结 */
    case 'open-know':
      if (view === 'quiz' && session) syncDraft();
      knowCh = t.dataset.ch || knowCh;
      view = 'know';
      window.scrollTo(0, 0);
      render();
      break;
    case 'start-random':  startRandom(); break;
    case 'start-exam':    startExam(); break;
    case 'start-wrong':   startWrongBook(); break;
    case 'practice-one':  startOne(t.dataset.id); break;
    case 'remove-wrong':
      delete S.wrong[t.dataset.id];
      saveState();
      render();
      break;

    /* --- 答题 --- */
    case 'pick': {
      const r = curR();
      if (r.done) break;
      r.sel = Number(t.dataset.i);
      render();
      break;
    }
    case 'pick-part': {
      const r = curR();
      if (r.done) break;
      if (!r.parts) r.parts = [];
      r.parts[Number(t.dataset.i)] = Number(t.dataset.j);
      syncDraft();
      render();
      break;
    }
    case 'submit-choice': submitChoice(); break;
    case 'submit-term':   submitTerm(); break;
    case 'submit-fill':   submitFill(); break;
    case 'grade-essay':   gradeEssayQ(); break;
    case 'regrade': {
      const r = curR();
      r.done = false;
      render();
      break;
    }
    case 'toggle-points': {
      const r = curR();
      syncDraft();
      r.showPoints = !r.showPoints;
      render();
      break;
    }
    case 'toggle-answer': {
      const r = curR();
      syncDraft();
      r.showAnswer = !r.showAnswer;
      render();
      break;
    }
    case 'prev': gotoQuestion(session.idx - 1); break;
    case 'next':
      if (session.idx === session.qs.length - 1) finishSession(false);
      else gotoQuestion(session.idx + 1);
      break;
    case 'jump': gotoQuestion(Number(t.dataset.i)); break;
    case 'finish': finishSession(false); break;

    /* --- 结果页 --- */
    case 'retry-wrong': {
      const qs = session.qs.filter(q => (session.res[q.id] && session.res[q.id].pct) < 60);
      if (!qs.length) return;
      startSession('retry', '错题重做 · ' + qs.length + ' 题', qs);
      break;
    }
    case 'again': {
      const qs = session.qs.slice();
      if (session.mode === 'exam') startExam();
      else if (session.mode === 'chapter') startChapter(qs[0].chapter);
      else if (session.mode === 'kp') startKp(kpKeyOf(qs[0]));
      else startSession(session.mode, session.title, qs);
      break;
    }

    /* --- 多科目 / 新题型 --- */
    case 'subjects':
      if (view === 'quiz' && session) syncDraft();
      view = 'subjects';
      window.scrollTo(0, 0);
      render();
      break;
    case 'switch-subject': switchSubject(t.dataset.subj); break;
    case 'pick-multi': {
      const r = curR();
      if (r.done) break;
      const i = Number(t.dataset.i);
      const arr = Array.isArray(r.sel) ? r.sel.slice() : [];
      const p = arr.indexOf(i);
      if (p >= 0) arr.splice(p, 1); else arr.push(i);
      r.sel = arr;
      render();
      break;
    }
    case 'submit-hq': submitHQ(); break;
    case 'start-kp': startKp(t.dataset.kp); break;
    case 'do-search': updateSearchResults(); break;

    /* --- 统计页 --- */
    case 'reset-all':
      if (confirm('确定清空「' + subj().name + '」的练习数据（错题本 / 得分 / 章节进度）吗？其他科目不受影响，此操作不可恢复。')) {
        S = emptyState();
        saveState();
        render();
      }
      break;
  }
});

/* 输入事件：实时同步草稿，保证切题/重绘不丢答案 */
document.addEventListener('input', e => {
  const t = e.target;
  if (!session) return;
  const q = curQ();
  if (!q) return;
  const r = session.res[q.id] || (session.res[q.id] = {});
  if (t.id === 'fillIn') r.draft = t.value;
  else if (t.id === 'essayIn') r.draft = t.value;
  else if (t.id === 'hIn') r.draft = t.value;
  else if (t.id === 'searchIn') { searchQ = t.value; updateSearchResults(); }
  else if (t.classList.contains('term-inp')) {
    if (!r.terms) r.terms = {};
    r.terms[t.dataset.term] = t.value;
  }
  else if (t.classList.contains('part-input')) {
    if (!r.parts) r.parts = [];
    r.parts[Number(t.dataset.part)] = t.value;
  }
});

/* 回车快捷提交：填空 / 术语填空直接判分，省去点按钮 */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !session || view !== 'quiz') return;
  const t = e.target;
  if (t.id === 'fillIn') { e.preventDefault(); submitFill(); }
  else if (t.id === 'hIn' && t.tagName === 'INPUT') { e.preventDefault(); submitHQ(); }
  else if (t.classList && t.classList.contains('term-inp')) {
    e.preventDefault();
    /* 还有空没填时先跳到下一个空，都填完再判分 */
    const all = [...document.querySelectorAll('.term-inp')];
    const next = all.find(x => !String(x.value).trim());
    if (next) next.focus(); else submitTerm();
  }
});

/* 自评勾选 */
document.addEventListener('change', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('selfcheck')) {
    updateSelfScore(Number(t.dataset.i), t.checked);
  }
  /* 组件匹配 / 流程排序：把选择写进作答对象，并就地刷新提交按钮的可用状态 */
  if (!session || view !== 'quiz') return;
  const q = curQ();
  if (!q) return;
  const r = session.res[q.id] || (session.res[q.id] = {});
  if (r.done) return;
  if (t.dataset && t.dataset.mi != null) {
    if (!Array.isArray(r.match)) r.match = [];
    r.match[Number(t.dataset.mi)] = t.value === '' ? null : Number(t.value);
    render();
  } else if (t.dataset && t.dataset.oi != null) {
    if (!Array.isArray(r.order)) r.order = [];
    r.order[Number(t.dataset.oi)] = t.value === '' ? null : Number(t.value);
    render();
  }
});

/* ---- 启动 ----
   1) 先切到默认科目（数据库原理），设置主题
   2) 探测 localStorage：不可用时显示顶部固定提示，但页面继续可用（只是不保存）
   3) 读取 db_quiz_state_v1（沿用原键名，旧进度不丢）
   4) 首页进入「科目选择」，由用户决定进哪个科目
*/
document.body.dataset.subj = CUR_SUB;
if (!probeStorage()) showStoreWarn();
loadState();
view = 'subjects';
render();
</script>
